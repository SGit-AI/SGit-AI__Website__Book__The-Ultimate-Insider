<text x="0.00" y="34.62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#b0481a">The first round: sent back</text>
<text x="0.60" y="39.39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-style="italic" fill="#1f2933">“What it is not yet is a</text>
<text x="0.60" y="43.36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-style="italic" fill="#1f2933">picture a room reads in</text>
<text x="0.60" y="47.33" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-style="italic" fill="#1f2933">five seconds.”</text>
