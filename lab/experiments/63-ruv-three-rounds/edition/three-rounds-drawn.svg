<text x="56.00" y="34.62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">The second: kept, with notes</text>
<text x="56.00" y="38.59" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">for the next</text>
<text x="56.60" y="43.36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-style="italic" fill="#1f2933">“Numbered dots, plain words</text>
<text x="56.60" y="47.33" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-style="italic" fill="#1f2933">and named rings make it</text>
<text x="56.60" y="51.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-style="italic" fill="#1f2933">readable.”</text>
