 <figure class="fig span12">
  <p class="fig-title">One picture's three rounds</p>
  <div style="display:flex;gap:4mm"><figure style="margin:0;flex:1"><img src="{{dir}}/stills/e02-v1.png" alt="E02 v1, its last frame" style="width:100%;display:block;border:.3mm solid var(--fill-2)"><p style="font:700 9pt/12pt var(--sans);margin:1.5mm 0 .5mm">The first round: sent back</p><p style="font:italic 9pt/12pt var(--sans);margin:0">“What it is not yet is a picture a room reads in five seconds.”</p><p style="font:400 9pt/12pt var(--sans);color:var(--muted);margin:.5mm 0 0">deck, 78b89b9</p></figure><figure style="margin:0;flex:1"><img src="{{dir}}/stills/e02-v2.png" alt="E02 v2, its last frame" style="width:100%;display:block;border:.3mm solid var(--fill-2)"><p style="font:700 9pt/12pt var(--sans);margin:1.5mm 0 .5mm">The second: kept, with notes for the next</p><p style="font:italic 9pt/12pt var(--sans);margin:0">“Numbered dots, plain words and named rings make it readable.”</p><p style="font:400 9pt/12pt var(--sans);color:var(--muted);margin:.5mm 0 0">deck, eefc1d3</p></figure><figure style="margin:0;flex:1"><img src="{{dir}}/stills/e02-v3.png" alt="E02 v3, its last frame" style="width:100%;display:block;border:.3mm solid var(--fill-2)"><p style="font:700 9pt/12pt var(--sans);margin:1.5mm 0 .5mm">The third: kept, ready for the editor</p><p style="font:italic 9pt/12pt var(--sans);margin:0">“Three passes, and every note is in.”</p><p style="font:400 9pt/12pt var(--sans);color:var(--muted);margin:.5mm 0 0">deck, 19e7f2d</p></figure></div>
  <figcaption><b>The same data three times: a table beside a diagram, then numbered dots in named rings, then the dots grouped by what is at risk. Nobody was watching, and the picture was sent back, kept with notes, and kept for the editor.</b> The dot numbers are labels, not counts.<span class="src">The talk's own stills at 298be4e (team/ruv-sgit/debriefs/img/); deck's words from its review pages and debrief there. The stills' numbers: C084 (grant, mandate, excess, rows measured) and C086 (the excess by kind).</span></figcaption>
