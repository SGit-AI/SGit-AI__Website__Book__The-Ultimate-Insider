<svg xmlns="http://www.w3.org/2000/svg" width="155mm" height="43mm" viewBox="0 0 155 43" role="img" aria-label="The day as a thin strip, from the empty project to the talk, nearly nineteen hours"><rect x="36.73" y="18.4" width="73.38" height="3.2" fill="#eef2f6"/><line x1="6.00" y1="20.00" x2="149.00" y2="20.00" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><circle cx="8.01" cy="20.0" r="1.6" fill="#1f2933"/><line x1="8.01" y1="18.00" x2="8.01" y2="14.60" stroke="#d5dce4" stroke-width="0.3" stroke-linecap="round"/><text x="7.01" y="13.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">the empty project</text><circle cx="11.02" cy="20.0" r="1.6" fill="#1f2933"/><line x1="11.02" y1="22.00" x2="11.02" y2="24.60" stroke="#d5dce4" stroke-width="0.3" stroke-linecap="round"/><text x="10.02" y="27.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the first agent</text><circle cx="23.06" cy="20.0" r="1.6" fill="#1f2933"/><line x1="23.06" y1="18.00" x2="23.06" y2="9.40" stroke="#d5dce4" stroke-width="0.3" stroke-linecap="round"/><text x="22.06" y="8.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the five steps</text><circle cx="36.73" cy="20.0" r="1.6" fill="#1f2933"/><line x1="36.73" y1="22.00" x2="36.73" y2="29.80" stroke="#d5dce4" stroke-width="0.3" stroke-linecap="round"/><text x="35.73" y="33.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the six alone</text><circle cx="110.11" cy="20.0" r="1.6" fill="#1f2933"/><line x1="110.11" y1="18.00" x2="110.11" y2="14.60" stroke="#d5dce4" stroke-width="0.3" stroke-linecap="round"/><text x="110.11" y="13.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="mid