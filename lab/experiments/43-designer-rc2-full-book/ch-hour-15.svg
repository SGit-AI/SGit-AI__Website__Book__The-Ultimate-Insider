<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="35mm" viewBox="0 0 164 35" role="img" aria-label="A card: hour fifteen's wakes by trigger, the schedule's and the editor's"><rect x=".3" y=".3" width="163.4" height="34" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="5.00" y="9.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#1f2933" text-anchor="start">hour fifteen</text><text x="5.00" y="14.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">14:00 to 14:59</text><rect x="40.00" y="6" width="55.38" height="9" fill="#5b6670"/><text x="41.40" y="21.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">6</text><text x="41.40" y="25.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">started by the schedule</text><rect x="95.38" y="6" width="64.62" height="9" fill="#b0481a"/><text x="158.60" y="21.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="end">7</text><text x="158.60" y="25.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">started by the editor</text><text x="5.00" y="31.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the hour's wakes by what started them; clock hours of 29 October, UTC</text></svg>
