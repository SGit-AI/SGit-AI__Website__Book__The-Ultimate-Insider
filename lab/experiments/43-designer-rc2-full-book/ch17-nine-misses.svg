<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="127.4mm" viewBox="0 0 164 127.4" role="img" aria-label="The 9 misses as cards, each with its cost in a line, as chapter 17 gives them"><rect x="0.3" y="0.3" width="80.0" height="30.4" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 2.7 l3 3 M6.3 2.7 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="5.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The lock never turned</text><text x="3.30" y="10.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the first part was never locked, that</text><text x="3.30" y="14.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">is, marked final so that no agent could</text><text x="3.30" y="18.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">change it; nothing stopped it changing</text><text x="3.30" y="22.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">on stage but the hold, the file that</text><text x="3.30" y="26.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">stops every member's next session.</text><rect x="83.1" y="0.3" width="80.0" height="30.4" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 2.7 l3 3 M89.1 2.7 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="5.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Two parts of three unfinished</text><text x="86.10" y="10.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">two parts of the talk never reached</text><text x="86.10" y="14.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">their finished state.</text><rect x="0.3" y="33.1" width="80.0" height="18.1" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 35.5 l3 3 M6.3 35.5 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="38.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The moment missed</text><text x="3.30" y="43.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the talk was split into parts without</text><text x="3.30" y="47.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the storyteller's split.</text><rect x="83.1" y="33.1" width="80.0" height="18.1" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 35.5 l3 3 M89.1 35.5 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="38.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The correction lost in the freeze</text><text x="86.10" y="43.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">an out-of-date figure on a slide at the</text><text x="86.10" y="47.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">end of the day.</text><rect x="0.3" y="53.6" width="80.0" height="26.3" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 56.0 l3 3 M6.3 56.0 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="59.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Other sites' data, pushed before</text><text x="9.30" y="63.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">it was stripped</text><text x="3.30" y="67.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">values from other sites' pages went out</text><text x="3.30" y="71.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">in a public push, and the history keeps</text><text x="3.30" y="76.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">what was pushed.</text><rect x="83.1" y="53.6" width="80.0" height="26.3" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 56.0 l3 3 M89.1 56.0 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="59.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">A key printed into a log</text><text x="86.10" y="63.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">a vault key in one session's own log,</text><text x="86.10" y="67.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">and a rotation.</text><rect x="0.3" y="82.3" width="80.0" height="22.2" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 84.7 l3 3 M6.3 84.7 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="87.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">A record that says what did not</text><text x="9.30" y="91.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">happen</text><text x="3.30" y="96.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the next session would have read part</text><text x="3.30" y="100.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">one as locked.</text><rect x="83.1" y="82.3" width="80.0" height="22.2" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 84.7 l3 3 M89.1 84.7 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="87.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Work with no name on it</text><text x="86.10" y="92.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the team's count of work by member could</text><text x="86.10" y="96.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">not see some of it.</text><rect x="0.3" y="106.9" width="80.0" height="18.1" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 109.3 l3 3 M6.3 109.3 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="112.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The claims that did not hold</text><text x="3.30" y="117.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">nothing on stage: no beat of the talk</text><text x="3.30" y="121.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">carries any of them.</text></svg>
