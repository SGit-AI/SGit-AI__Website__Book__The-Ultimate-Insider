<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="119.2mm" viewBox="0 0 164 119.2" role="img" aria-label="The 9 misses as cards, each with its cost in a line, as chapter 17 gives them"><rect x="0.3" y="0.3" width="80.0" height="22.2" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 2.7 l3 3 M6.3 2.7 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="5.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The lock never turned</text><text x="3.30" y="10.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the first part was never locked; nothing</text><text x="3.30" y="14.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">stopped it changing on stage but the</text><text x="3.30" y="18.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">hold.</text><rect x="83.1" y="0.3" width="80.0" height="22.2" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 2.7 l3 3 M89.1 2.7 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="5.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Two parts of three unfinished</text><text x="86.10" y="10.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">two parts of the talk never reached</text><text x="86.10" y="14.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">their finished state.</text><rect x="0.3" y="24.9" width="80.0" height="18.1" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 27.3 l3 3 M6.3 27.3 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="30.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The moment missed</text><text x="3.30" y="35.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the talk was split into parts without</text><text x="3.30" y="39.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the storyteller's split.</text><rect x="83.1" y="24.9" width="80.0" height="18.1" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 27.3 l3 3 M89.1 27.3 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="30.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The correction lost in the freeze</text><text x="86.10" y="35.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">an out-of-date figure on a slide at the</text><text x="86.10" y="39.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">end of the day.</text><rect x="0.3" y="45.4" width="80.0" height="26.3" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 47.8 l3 3 M6.3 47.8 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="50.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Other sites' data, pushed before</text><text x="9.30" y="54.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">it was stripped</text><text x="3.30" y="59.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">values from other sites' pages went out</text><text x="3.30" y="63.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">in a public push, and the history keeps</text><text x="3.30" y="67.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">what was pushed.</text><rect x="83.1" y="45.4" width="80.0" height="26.3" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 47.8 l3 3 M89.1 47.8 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="50.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">A key printed into a log</text><text x="86.10" y="55.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">a vault key in one session's own log,</text><text x="86.10" y="59.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">and a rotation.</text><rect x="0.3" y="74.1" width="80.0" height="22.2" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 76.5 l3 3 M6.3 76.5 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="79.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">A record that says what did not</text><text x="9.30" y="83.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">happen</text><text x="3.30" y="88.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the next session would have read part</text><text x="3.30" y="92.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">one as locked.</text><rect x="83.1" y="74.1" width="80.0" height="22.2" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.1 76.5 l3 3 M89.1 76.5 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="92.10" y="79.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Work with no name on it</text><text x="86.10" y="84.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the team's count of work by member could</text><text x="86.10" y="88.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">not see some of it.</text><rect x="0.3" y="98.7" width="80.0" height="18.1" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M3.3 101.1 l3 3 M6.3 101.1 l-3 3" stroke="#b0481a" stroke-width=".8"/><text x="9.30" y="104.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The claims that did not hold</text><text x="3.30" y="108.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">nothing on stage: no beat of the talk</text><text x="3.30" y="112.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">carries any of them.</text></svg>
