<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="41.1mm" viewBox="0 0 164 41.1" role="img" aria-label="A card: the brief's two companions, the reality file and the corrections file"><rect x="0.3" y=".3" width="80.6" height="34.3" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M4.0 4 h7 l2.4 2.4 v9 h-9.4 z" fill="#fff" stroke="#1f2933" stroke-width=".45"/><line x1="5.40" y1="8.00" x2="11.60" y2="8.00" stroke="#b0481a" stroke-width="0.35" stroke-linecap="round"/><line x1="5.40" y1="9.90" x2="11.60" y2="9.90" stroke="#b0481a" stroke-width="0.35" stroke-linecap="round"/><line x1="5.40" y1="11.80" x2="11.60" y2="11.80" stroke="#b0481a" stroke-width="0.35" stroke-linecap="round"/><line x1="5.40" y1="13.70" x2="11.60" y2="13.70" stroke="#b0481a" stroke-width="0.35" stroke-linecap="round"/><text x="17.00" y="10.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">the reality file</text><text x="4.00" y="22.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">kept current by whoever shipped, what</text><text x="4.00" y="26.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">exists now and nothing else, changed</text><text x="4.00" y="30.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">all day</text><rect x="82.7" y=".3" width="80.6" height="34.3" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M86.4 4 h7 l2.4 2.4 v9 h-9.4 z" fill="#fff" stroke="#1f2933" stroke-width=".45"/><line x1="87.80" y1="8.00" x2="94.00" y2="8.00" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="87.80" y1="9.90" x2="94.00" y2="9.90" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="87.80" y1="11.80" x2="94.00" y2="11.80" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="87.80" y1="13.70" x2="94.00" y2="13.70" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><text x="99.40" y="10.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">the corrections file</text><text x="86.40" y="22.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">for when the brief turned out to be</text><text x="86.40" y="26.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">wrong</text><text x="0.00" y="39.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">beside the brief, which nobody edits; each description as chapter 8 gives it</text></svg>
