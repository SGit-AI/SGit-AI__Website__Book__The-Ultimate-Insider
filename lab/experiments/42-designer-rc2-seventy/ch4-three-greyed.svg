<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="44.9mm" viewBox="0 0 164 44.9" role="img" aria-label="Three greyed cards: the storyteller, motion and studio, each with its job and one rule from its page"><rect x="0.3" y=".3" width="52.4" height="38.1" rx="1.8" fill="#fff" stroke="#d5dce4" stroke-width=".45"/><g transform="translate(1.00 1.20) scale(0.3)"><rect x="10" y="10" width="20" height="16" rx="3.2" fill="#ffffff" stroke="#d5dce4" stroke-width="1.1199999999999999"/><path d="M10.6 11.6 q2.4 -4.4 4.8 -.6 q2.4 -4.2 4.8 -.4 q2.4 -4.2 4.8 -.4 q2.2 -3.4 4.4 .8" fill="#d5dce4" stroke="#d5dce4" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="11.00" y="7.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#5b6670" text-anchor="start">storyteller</text><text x="3.00" y="15.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the talk's story, the arc,</text><text x="3.00" y="19.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the tree and the maps</text><text x="3.00" y="24.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">“Nothing goes into the</text><text x="3.00" y="28.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">talk until the editor has</text><text x="3.00" y="33.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">seen it.”</text><rect x="54.9" y=".3" width="52.4" height="38.1" rx="1.8" fill="#fff" stroke="#d5dce4" stroke-width=".45"/><g transform="translate(55.60 1.20) scale(0.3)"><rect x="10" y="10" width="20" height="16" rx="3.2" fill="#ffffff" stroke="#d5dce4" stroke-width="1.1199999999999999"/><path d="M11.4 11.2 a8.6 5.6 0 0 1 17.2 0 z" fill="#d5dce4" stroke="#d5dce4" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.6 11.2 h-4.6 q-.6 -1.4 .8 -1.4 h3.8" fill="#d5dce4" stroke="#d5dce4" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="65.60" y="7.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#5b6670" text-anchor="start">motion</text><text x="57.60" y="15.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the new story's</text><text x="57.60" y="19.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">animations, one request at</text><text x="57.60" y="23.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">a time from deck</text><text x="57.60" y="28.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">“One owner per file.”</text><rect x="109.5" y=".3" width="52.4" height="38.1" rx="1.8" fill="#fff" stroke="#d5dce4" stroke-width=".45"/><g transform="translate(110.20 1.20) scale(0.3)"><rect x="10" y="10" width="20" height="16" rx="3.2" fill="#ffffff" stroke="#d5dce4" stroke-width="1.1199999999999999"/><path d="M9.4 16.4 Q9.4 5.6 20 5.6 Q30.6 5.6 30.6 16.4" fill="none" stroke="#d5dce4" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="7.2" y="14.2" width="3.2" height="6.6" rx="1.2" fill="#d5dce4" stroke="#d5dce4" stroke-width=".5"/><rect x="29.6" y="14.2" width="3.2" height="6.6" rx="1.2" fill="#d5dce4" stroke="#d5dce4" stroke-width=".5"/></g><text x="120.20" y="7.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#5b6670" text-anchor="start">studio</text><text x="112.20" y="15.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">ports of earlier pieces</text><text x="112.20" y="19.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">rebuilt on this site's</text><text x="112.20" y="23.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">slide engine, working on</text><text x="112.20" y="27.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">an iPad</text><text x="112.20" y="33.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">“A port keeps its source.”</text><text x="0.00" y="43.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">greyed: on stage only from the afternoon; each with one rule from its own page</text></svg>
