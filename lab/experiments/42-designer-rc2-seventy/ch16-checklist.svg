<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="147.2mm" viewBox="0 0 164 147.2" role="img" aria-label="The checklist as one page: a box to tick, the chapter, and its first sentence, for each of chapters 1 to 15"><rect x=".3" y=".3" width="163.4" height="146.2" rx="1.6" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="5.00" y="8.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#1f2933" text-anchor="start">The checklist</text><rect x="5" y="13.10" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 1</text><text x="31.00" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Write down the one idea you want somebody to understand, and what they should</text><text x="31.00" y="20.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">be able to do after.</text><rect x="5" y="23.50" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="26.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 2</text><text x="31.00" y="26.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Look at one thing you made last month.</text><rect x="5" y="29.80" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="32.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 3</text><text x="31.00" y="32.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Write your one page of rules: what your agent is for, what it may change, and</text><text x="31.00" y="36.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">when it must stop and ask you.</text><rect x="5" y="40.20" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="43.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 4</text><text x="31.00" y="43.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Write a second page of rules for a second agent, with a different thing it may</text><text x="31.00" y="47.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">change.</text><rect x="5" y="50.60" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="53.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 5</text><text x="31.00" y="53.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Name your hold, and write down who may lift it.</text><rect x="5" y="56.90" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="59.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 6</text><text x="31.00" y="59.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Give your agents one folder for requests between them, and read it every</text><text x="31.00" y="63.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">morning.</text><rect x="5" y="67.30" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="70.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 7</text><text x="31.00" y="70.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Decide which work runs on a clock and which waits for you, and write it down.</text><rect x="5" y="73.60" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="76.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 8</text><text x="31.00" y="76.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Add one check to your project that every change must pass.</text><rect x="5" y="79.90" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="82.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 9</text><text x="31.00" y="82.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Give one small thing to somebody else today, and write down what they asked</text><text x="31.00" y="86.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">for differently.</text><rect x="5" y="90.30" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="93.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 10</text><text x="31.00" y="93.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Write your hold file now, before you need it: one line saying what it stops,</text><text x="31.00" y="97.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">and one line saying who lifts it.</text><rect x="5" y="100.70" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="103.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 11</text><text x="31.00" y="103.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Write down your last three misses, each in one line: what it was, what it</text><text x="31.00" y="107.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">cost, and what you would put in place so the next one is caught sooner.</text><rect x="5" y="111.10" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="114.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 12</text><text x="31.00" y="114.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Write down who may stop your factory, who may restart it, and who decides when</text><text x="31.00" y="118.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">its owner is away.</text><rect x="5" y="121.50" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="124.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 13</text><text x="31.00" y="124.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Give every agent a status file and a debrief folder, and make reading them the</text><text x="31.00" y="128.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">first step of every session.</text><rect x="5" y="131.90" width="3.2" height="3.2" rx=".4" fill="#fff" stroke="#1f2933" stroke-width=".4"/><text x="11.00" y="134.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">chapter 14</text><text x="31.00" y="134.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">If you will work with others, write the hold's two lines now: who may pull it,</text><text x="31.00" y="138.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">and who may lift it when its owner is away.</text></svg>
