<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="180.5mm" viewBox="0 0 164 180.5" role="img" aria-label="The storyteller's story tree as it was at 14:19: the premise, three parts and their beats"><rect x="20" y=".3" width="124" height="15.3" rx="2" fill="#1f2933"/><text x="82.00" y="4.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="middle">PREMISE The perfect storm we are brewing: agents are the</text><text x="82.00" y="8.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="middle">ultimate insider, and the old limits on an attacker no</text><text x="82.00" y="12.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="middle">longer hold</text><line x1="82.00" y1="15.60" x2="26.50" y2="19.30" stroke="#d5dce4" stroke-width="0.5" stroke-linecap="round"/><rect x="0.3" y="19.3" width="53" height="15.3" rx="1.6" fill="#b0481a"/><text x="2.40" y="23.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="start">PART 1 The outside is in</text><text x="2.40" y="27.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="start">balance. The inside is the</text><text x="2.40" y="31.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="start">storm.</text><rect x="2.0" y="36.6" width="51.3" height="14.7" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="3.60" y="40.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">1.1 The past: many small</text><text x="3.60" y="44.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">attackers, never mass</text><text x="3.60" y="48.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">exploitation</text><rect x="2.0" y="52.7" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="3.60" y="56.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">1.2 The building: they turned</text><text x="3.60" y="60.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">left. Agents turn right.</text><rect x="2.0" y="64.7" width="51.3" height="14.7" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="3.60" y="68.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">1.3 The question for the</text><text x="3.60" y="72.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">audience: it could have been</text><text x="3.60" y="76.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">much worse</text><rect x="2.0" y="80.8" width="51.3" height="14.7" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="3.60" y="84.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">1.4 The outside is in</text><text x="3.60" y="88.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">balance; open source is about</text><text x="3.60" y="92.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">to get very secure</text><rect x="2.0" y="96.9" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="3.60" y="100.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">1.5 The inside: four</text><text x="3.60" y="104.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">ingredients of the storm</text><rect x="6.0" y="108.9" width="47.3" height="10.4" rx="1" fill="#eef2f6"/><text x="7.60" y="112.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">legacy apps nobody</text><text x="7.60" y="116.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">understands</text><rect x="6.0" y="120.3" width="47.3" height="10.4" rx="1" fill="#eef2f6"/><text x="7.60" y="124.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">systems not built for</text><text x="7.60" y="128.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">agents</text><rect x="6.0" y="131.7" width="47.3" height="14.5" rx="1" fill="#eef2f6"/><text x="7.60" y="135.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">primitive controls, so</text><text x="7.60" y="139.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">everything is over-</text><text x="7.60" y="143.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">privileged</text><rect x="6.0" y="147.2" width="47.3" height="10.4" rx="1" fill="#eef2f6"/><text x="7.60" y="150.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">security usability is bad,</text><text x="7.60" y="155.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">even for experts</text><rect x="2.0" y="158.6" width="51.3" height="14.7" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="3.60" y="162.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">1.6 The shift: from</text><text x="3.60" y="166.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">availability and</text><text x="3.60" y="170.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">confidentiality to integrity</text><line x1="82.00" y1="15.60" x2="81.50" y2="19.30" stroke="#d5dce4" stroke-width="0.5" stroke-linecap="round"/><rect x="55.3" y="19.3" width="53" height="11.2" rx="1.6" fill="#b0481a"/><text x="57.40" y="23.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="start">PART 2 The explosion of</text><text x="57.40" y="27.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="start">software: explorer coding</text><rect x="57.0" y="32.5" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="58.60" y="36.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">2.1 Spreadsheets become</text><text x="58.60" y="40.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">applications</text><rect x="57.0" y="44.5" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="58.60" y="48.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">2.2 More software, more</text><text x="58.60" y="52.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">surface</text><rect x="57.0" y="56.5" width="51.3" height="14.7" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="58.60" y="60.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">2.3 The opportunity: security</text><text x="58.60" y="64.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">at that scale. Start</text><text x="58.60" y="68.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">companies.</text><line x1="82.00" y1="15.60" x2="136.50" y2="19.30" stroke="#d5dce4" stroke-width="0.5" stroke-linecap="round"/><rect x="110.3" y="19.3" width="53" height="7.1" rx="1.6" fill="#b0481a"/><text x="112.40" y="23.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#fff" text-anchor="start">PART 3 What we do about it</text><rect x="112.0" y="28.4" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="113.60" y="32.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">3.1 Map it: reach, mandate,</text><text x="113.60" y="36.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the gap</text><rect x="112.0" y="40.4" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="113.60" y="44.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">3.2 Behaviour policies:</text><text x="113.60" y="48.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">agent, process, decision</text><rect x="112.0" y="52.4" width="51.3" height="6.5" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="113.60" y="56.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">3.3 A licence to operate</text><rect x="112.0" y="60.3" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="113.60" y="64.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">3.4 Live: an agent trying to</text><text x="113.60" y="68.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">do what it cannot do</text><rect x="112.0" y="72.3" width="51.3" height="10.6" rx="1.2" fill="#fff" stroke="#1f2933" stroke-width=".35"/><text x="113.60" y="76.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Close: brakes let a car go</text><text x="113.60" y="80.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">fast</text><text x="0.00" y="178.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the tree's own nodes at 14:19, verbatim, its dotted links left out; no turn marked at 14:19 (from 16:04 the tree names one)</text></svg>
