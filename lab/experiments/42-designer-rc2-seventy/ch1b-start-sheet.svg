<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="92.5mm" viewBox="0 0 164 92.5" role="img" aria-label="The start-here page as one printable sheet: the five steps, a box beside each"><rect x=".3" y=".3" width="163.4" height="86.3" rx="1.6" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="5.00" y="9.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#1f2933" text-anchor="start">Start here</text><rect x="5" y="14.6" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13.00" y="18.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">One tool and one empty project.</text><text x="13.00" y="22.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">An account with an AI agent tool and a new, empty project; an app builder works</text><text x="13.00" y="26.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">too. Put nothing private in it.</text><rect x="5" y="29.9" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13.00" y="33.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">One page of rules</text><text x="13.00" y="37.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">, in your own words: what the agent is for, what it may change, and when it must</text><text x="13.00" y="41.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">stop and ask you.</text><rect x="5" y="45.2" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13.00" y="48.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">One brief</text><text x="13.00" y="52.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">: what you want made, for whom, by when. Hand both to your first agent.</text><rect x="5" y="56.4" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13.00" y="59.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">Your agent builds, you check:</text><text x="13.00" y="63.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">ship something small that somebody else can use, the same day. Then do it again.</text><rect x="5" y="67.6" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13.00" y="71.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">A second agent only when the first is busy.</text><text x="13.00" y="75.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Working with others? Share the brief, the board and the hold, and write down who</text><text x="13.00" y="79.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">may lift the hold when its owner is away.</text><text x="0.00" y="90.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the five steps as the start-here page gives them; a box beside each, to print and tick</text></svg>
