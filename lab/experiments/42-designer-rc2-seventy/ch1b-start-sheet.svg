<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="70.5mm" viewBox="0 0 164 70.5" role="img" aria-label="The start-here page as one printable sheet: the five steps, a box beside each"><rect x=".3" y=".3" width="163.4" height="69.9" rx="1.6" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="5.00" y="9.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#1f2933" text-anchor="start">Start here</text><rect x="5" y="14.6" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13" y="18.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="700">One tool and one empty project.</tspan> <tspan font-weight="400">An account with an AI agent tool and a new, empty project; an</tspan></text><text x="13" y="22.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="400">app builder works too. Put nothing private in it.</tspan></text><rect x="5" y="25.8" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13" y="29.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="700">One page of rules</tspan><tspan font-weight="400">, in your own words: what the agent is for, what it may change, and when it</tspan></text><text x="13" y="33.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="400">must stop and ask you.</tspan></text><rect x="5" y="37.0" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13" y="40.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="700">One brief</tspan><tspan font-weight="400">: what you want made, for whom, by when. Hand both to your first agent.</tspan></text><rect x="5" y="44.1" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13" y="47.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="700">Your agent builds, you check:</tspan> <tspan font-weight="400">ship something small that somebody else can use, the same day.</tspan></text><text x="13" y="51.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="400">Then do it again.</tspan></text><rect x="5" y="55.3" width="4.2" height="4.2" rx=".5" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="13" y="58.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="700">A second agent only when the first is busy.</tspan> <tspan font-weight="400">Working with others? Share the brief, the board</tspan></text><text x="13" y="62.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" fill="#1f2933"><tspan font-weight="400">and the hold, and write down who may lift the hold when its owner is away.</tspan></text></svg>
