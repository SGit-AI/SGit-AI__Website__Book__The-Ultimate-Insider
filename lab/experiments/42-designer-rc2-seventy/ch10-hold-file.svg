<svg xmlns="http://www.w3.org/2000/svg" width="140mm" height="57mm" viewBox="0 0 140 57" role="img" aria-label="The hold file as a page: its title, and its last line large: No member lifts it."><path d="M0.5 .5 h129 l10 10 v46 h-139 z" fill="#fff" stroke="#1f2933" stroke-width=".5"/><path d="M129.5 .5 v10 h10" fill="none" stroke="#1f2933" stroke-width=".45"/><text x="6.50" y="9.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.9" font-weight="800" fill="#b0481a" text-anchor="start">HOLD: the editor's usage limit is at 95%;</text><text x="6.50" y="14.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.9" font-weight="800" fill="#b0481a" text-anchor="start">pause all actions</text><rect x="6.5" y="20" width="86" height="1.6" rx=".8" fill="#d5dce4"/><rect x="6.5" y="24" width="64" height="1.6" rx=".8" fill="#d5dce4"/><rect x="6.5" y="28" width="92" height="1.6" rx=".8" fill="#d5dce4"/><rect x="6.5" y="32" width="74" height="1.6" rx=".8" fill="#d5dce4"/><text x="6.50" y="41.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">What lifts it: the editor deletes this file and re-enables the paused tasks.</text><text x="6.50" y="50.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#1f2933" text-anchor="start">No member lifts it.</text></svg>
