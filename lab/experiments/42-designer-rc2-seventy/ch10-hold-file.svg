<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="100mm" viewBox="0 0 164 100" role="img" aria-label="The hold file as a page: its title, and its last line large: No member lifts it."><path d="M22 2 h108 l12 12 v76 h-120 z" fill="#fff" stroke="#1f2933" stroke-width=".6"/><path d="M130 2 v12 h12" fill="none" stroke="#1f2933" stroke-width=".5"/><text x="29.00" y="15.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#b0481a" text-anchor="start">HOLD: the editor's usage limit is at 95%;</text><text x="29.00" y="21.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.6" font-weight="800" fill="#b0481a" text-anchor="start">pause all actions</text><rect x="29" y="30" width="92" height="2" rx="1" fill="#d5dce4"/><rect x="29" y="35" width="70" height="2" rx="1" fill="#d5dce4"/><rect x="29" y="41" width="100" height="2" rx="1" fill="#d5dce4"/><rect x="29" y="46" width="96" height="2" rx="1" fill="#d5dce4"/><rect x="29" y="51" width="60" height="2" rx="1" fill="#d5dce4"/><rect x="29" y="57" width="98" height="2" rx="1" fill="#d5dce4"/><rect x="29" y="62" width="84" height="2" rx="1" fill="#d5dce4"/><text x="29.00" y="72.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">What lifts it: the editor deletes this file and re-enables the paused tasks.</text><text x="29.00" y="84.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.4" font-weight="800" fill="#1f2933" text-anchor="start">No member lifts it.</text><text x="22.00" y="97.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">team/conductor/HOLD.md at 298be4e, written 18:44:13 (C006); never lifted that day (C024)</text></svg>
