<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="48mm" viewBox="0 0 164 48" role="img" aria-label="The day as three states: running, held, released; anyone may hold, only the editor releases; released never reached"><defs><marker id="s" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1f2933"/></marker><marker id="s2" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#5b6670"/></marker></defs><ellipse cx="26" cy="24" rx="22" ry="15" fill="#eef2f6" stroke="#1f2933" stroke-width=".7"/><text x="26.00" y="25.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#1f2933" text-anchor="middle">running</text><text x="26.00" y="31.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">the day</text><ellipse cx="88" cy="24" rx="17" ry="13" fill="#fff" stroke="#b0481a" stroke-width="1.2"/><text x="88.00" y="25.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#b0481a" text-anchor="middle">held</text><text x="88.00" y="31.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">from 18:44</text><ellipse cx="142" cy="24" rx="17" ry="13" fill="#fff" stroke="#5b6670" stroke-width=".6" stroke-dasharray="1.6 1.2"/><text x="142.00" y="25.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#5b6670" text-anchor="middle">released</text><text x="142.00" y="31.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">not reached</text><path d="M49 24 H69" stroke="#1f2933" stroke-width=".8" marker-end="url(#s)"/><text x="59.00" y="19.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="middle">anyone</text><path d="M106 24 H123" stroke="#5b6670" stroke-width=".8" stroke-dasharray="1.6 1.2" marker-end="url(#s2)"/><text x="114.50" y="10.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="middle">the editor</text><text x="114.50" y="15.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="middle">only</text><text x="0.00" y="46.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the hold at 18:44:13; by the end of the day's record it was not lifted</text></svg>
