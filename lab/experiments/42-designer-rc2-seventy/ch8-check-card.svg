<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="61.1mm" viewBox="0 0 164 61.1" role="img" aria-label="A card: what the check looked at that first night, seven things, each ticked"><rect x=".3" y=".3" width="163.4" height="54.9" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><g transform="translate(3.00 1.20) scale(0.34)"><rect x="10" y="10" width="20" height="16" rx="3.2" fill="#eef2f6" stroke="#1f2933" stroke-width="1.1199999999999999"/><circle cx="17" cy="18" r=".9" fill="#1f2933"/><circle cx="23" cy="18" r=".9" fill="#1f2933"/><path d="M17.4 21.3 Q20 23.9 22.6 21.3" fill="none" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.2 11.4 a8.8 6.4 0 0 1 17.6 0 z" fill="#3d7a3d" stroke="#1f2933" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="8.60" y1="11.40" x2="31.40" y2="11.40" stroke="#1f2933" stroke-width="1.1" stroke-linecap="round"/></g><text x="15.00" y="7.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">what the check looked at, that first night</text><path d="M6 14.4 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">every link resolves</text><path d="M6 20.1 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="21.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">every page has its plain-text twin</text><path d="M6 25.8 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="27.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">no code loaded from elsewhere</text><path d="M6 31.5 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="33.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">every script parses</text><path d="M6 37.2 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="38.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">every beat has a slide</text><path d="M6 42.9 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="44.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">no long dash in the prose</text><path d="M6 48.6 l1.4 1.4 l2.8 -2.8" fill="none" stroke="#b0481a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14.00" y="50.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">a tripwire over every file for anything that looks like a secret</text><text x="0.00" y="59.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">the seven things as chapter 8 lists them; the same test for every change</text></svg>
