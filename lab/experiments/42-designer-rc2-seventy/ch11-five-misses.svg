<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="87.5mm" viewBox="0 0 164 87.5" role="img" aria-label="The five misses as five cards, each with its cost in a line and where it rests"><rect x=".3" y="0.3" width="163.4" height="17.6" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M4 2.9 l3.2 3.2 M7.2 2.9 l-3.2 3.2" stroke="#b0481a" stroke-width=".8"/><text x="10.40" y="5.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The lock never turned</text><text x="159.60" y="5.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">C027</text><text x="10.40" y="10.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the first part was never locked, and nothing stopped it changing on stage but</text><text x="10.40" y="14.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the hold.</text><rect x=".3" y="20.1" width="163.4" height="13.5" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M4 22.7 l3.2 3.2 M7.2 22.7 l-3.2 3.2" stroke="#b0481a" stroke-width=".8"/><text x="10.40" y="25.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Two parts of three unfinished</text><text x="159.60" y="25.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">C027</text><text x="10.40" y="30.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">two parts of the talk never reached their finished state.</text><rect x=".3" y="35.8" width="163.4" height="13.5" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M4 38.4 l3.2 3.2 M7.2 38.4 l-3.2 3.2" stroke="#b0481a" stroke-width=".8"/><text x="10.40" y="41.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The moment missed</text><text x="159.60" y="41.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">the storyteller's debrief</text><text x="10.40" y="46.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the split was made without the storyteller's turn.</text><rect x=".3" y="51.5" width="163.4" height="13.5" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M4 54.1 l3.2 3.2 M7.2 54.1 l-3.2 3.2" stroke="#b0481a" stroke-width=".8"/><text x="10.40" y="57.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The correction lost in the freeze</text><text x="159.60" y="57.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">C031</text><text x="10.40" y="61.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">an out-of-date figure on a slide at the end of the day.</text><rect x=".3" y="67.2" width="163.4" height="13.5" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><path d="M4 69.8 l3.2 3.2 M7.2 69.8 l-3.2 3.2" stroke="#b0481a" stroke-width=".8"/><text x="10.40" y="72.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">The claims that did not hold</text><text x="159.60" y="72.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">C029, C030</text><text x="10.40" y="77.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">nothing on stage: no beat of the talk carries any of them.</text><text x="0.00" y="85.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">each heading and its cost as chapter 11 gives them; the failures stay in</text></svg>
