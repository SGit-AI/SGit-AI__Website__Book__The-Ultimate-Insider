<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="74mm" viewBox="0 0 164 74" role="img" aria-label="The two teams as two rooms: the talk's record above, read by each; one arrow, the hand-off, from this book's room to the Cold-Read room, drawn once; the way back shut."><rect x="57" y="2" width="50" height="15" rx="1.5" fill="#eef2f6" stroke="#1f2933" stroke-width=".7"/><text x="82.00" y="8.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#1f2933" text-anchor="middle">the record</text><text x="82.00" y="13.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">the talk's repository, read only</text><rect x="6" y="34" width="56" height="36" rx="1" fill="#fff" stroke="#1f2933" stroke-width="1.1"/><text x="34.00" y="41.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#1f2933" text-anchor="middle">this book's room</text><text x="34.00" y="46.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">its briefs, its timeline, its team</text><circle cx="18" cy="54" r="1.6" fill="#1f2933"/><path d="M15.4 59.4 A2.6 2.6 0 0 1 20.6 59.4 Z" fill="#1f2933"/><circle cx="28" cy="54" r="1.6" fill="#1f2933"/><path d="M25.4 59.4 A2.6 2.6 0 0 1 30.6 59.4 Z" fill="#1f2933"/><circle cx="38" cy="54" r="1.6" fill="#1f2933"/><path d="M35.4 59.4 A2.6 2.6 0 0 1 40.6 59.4 Z" fill="#1f2933"/><circle cx="48" cy="54" r="1.6" fill="#1f2933"/><path d="M45.4 59.4 A2.6 2.6 0 0 1 50.6 59.4 Z" fill="#1f2933"/><circle cx="23" cy="62" r="1.6" fill="#1f2933"/><path d="M20.4 67.4 A2.6 2.6 0 0 1 25.6 67.4 Z" fill="#1f2933"/><circle cx="33" cy="62" r="1.6" fill="#1f2933"/><path d="M30.4 67.4 A2.6 2.6 0 0 1 35.6 67.4 Z" fill="#1f2933"/><circle cx="43" cy="62" r="1.6" fill="#1f2933"/><path d="M40.4 67.4 A2.6 2.6 0 0 1 45.6 67.4 Z" fill="#1f2933"/><rect x="102" y="34" width="56" height="36" rx="1" fill="#fff" stroke="#1f2933" stroke-width="1.1"/><text x="130.00" y="41.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#1f2933" text-anchor="middle">the Cold-Read room</text><text x="130.00" y="46.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">the record, and nothing else</text><circle cx="114" cy="54" r="1.6" fill="#1f2933"/><path d="M111.4 59.4 A2.6 2.6 0 0 1 116.6 59.4 Z" fill="#1f2933"/><circle cx="124" cy="54" r="1.6" fill="#1f2933"/><path d="M121.4 59.4 A2.6 2.6 0 0 1 126.6 59.4 Z" fill="#1f2933"/><circle cx="134" cy="54" r="1.6" fill="#1f2933"/><path d="M131.4 59.4 A2.6 2.6 0 0 1 136.6 59.4 Z" fill="#1f2933"/><circle cx="144" cy="54" r="1.6" fill="#1f2933"/><path d="M141.4 59.4 A2.6 2.6 0 0 1 146.6 59.4 Z" fill="#1f2933"/><circle cx="119" cy="62" r="1.6" fill="#1f2933"/><path d="M116.4 67.4 A2.6 2.6 0 0 1 121.6 67.4 Z" fill="#1f2933"/><circle cx="129" cy="62" r="1.6" fill="#1f2933"/><path d="M126.4 67.4 A2.6 2.6 0 0 1 131.6 67.4 Z" fill="#1f2933"/><circle cx="139" cy="62" r="1.6" fill="#1f2933"/><path d="M136.4 67.4 A2.6 2.6 0 0 1 141.6 67.4 Z" fill="#1f2933"/><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1f2933"/></marker><marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#b0481a"/></marker></defs><path d="M70 17 C 60 24, 40 26, 34 33" fill="none" stroke="#1f2933" stroke-width=".8" marker-end="url(#a)"/><path d="M94 17 C 104 24, 124 26, 130 33" fill="none" stroke="#1f2933" stroke-width=".8" marker-end="url(#a)"/><text x="44.00" y="23.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">read</text><text x="120.00" y="23.00" font-family="Inter, Helvetica, Arial, sans-serif" font-s