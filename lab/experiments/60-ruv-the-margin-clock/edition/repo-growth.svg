<text x="92.80" y="11.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.293" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">(svg, js and css are a few files each: thin bands)</text>
<text x="6.00" y="79.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.293" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">Hour 00 is the repository at its last commit of that hour, 00:54; hour 18 is the day's last release, 18:46, after the hold.</text>
<text x="6.00" y="82.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.293" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">The bars follow dev's first-parent line: a branch merged late makes an hour look quieter than the work done in it.</text>
<text x="6.00" y="85.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.293" font-weight="400" fill="#5b6670" text-anchor="start">"Other" is everything else: images, text files, scripts, QR codes. Every value: the register, C124.</text>
</svg>
