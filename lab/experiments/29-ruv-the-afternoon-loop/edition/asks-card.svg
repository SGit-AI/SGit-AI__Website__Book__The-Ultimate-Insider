<text x="4.00" y="72.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">"Asked" is the time written in the commit's subject, not a clock; "recorded" is the commit's own time.</text>
<text x="4.00" y="76.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">For the conductor's rows, the recorded time is the conductor routing the ask, not the work landing.</text>
<text x="4.00" y="79.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start">Every time: the register, C105.</text>
