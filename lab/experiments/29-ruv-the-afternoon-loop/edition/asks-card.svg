<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="162.4mm" viewBox="0 0 164 162.4" role="img" aria-label="His afternoon asks: for each, what was built, the major ones marked, and the time from his ask to the work; then the two larger asks of the feedback round.">
<g transform="translate(0,-7.0)">
<text x="3.00" y="12.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#5b6670" text-anchor="start">asked</text>
<text x="16.00" y="12.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#5b6670" text-anchor="start">what was built, and the time from his ask to the work</text>
<line x1="3.0" y1="13.40" x2="161.0" y2="13.40" stroke="#d5dce4" stroke-width=".3"/>
<text x="3.00" y="17.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#b0481a" text-anchor="start">17:27</text>
<text x="16.00" y="17.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#1f2933" text-anchor="start">'when in doubt add it': deck placed 11 pieces in the talk, 47 beats to 58</text>
<rect x="148.50" y="14.40" width="12.5" height="4.0" rx="2" fill="#b0481a"/>
<text x="154.75" y="17.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#ffffff" text-anchor="middle">major</text>
<rect x="16.00" y="19.80" width="30.12" height="1.9" fill="#b0481a"/>
<text x="47.62" y="21.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">25 min 15 s</text>
<text x="3.00" y="29.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#b0481a" text-anchor="start">17:30</text>
<text x="16.00" y="29.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#1f2933" text-anchor="start">the team's own policies and his review page: studio's policy review page, then two</text>
<text x="16.00" y="32.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#1f2933" text-anchor="start">more showcases</text>
<rect x="148.50" y="26.10" width="12.5" height="4.0" rx="2" fill="#b0481a"/>
<text x="154.75" y="29.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#ffffff" text-anchor="middle">major</text>
<rect x="16.00" y="35.20" width="20.83" height="1.9" fill="#b0481a"/>
<text x="38.33" y="37.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">17 min 28 s to the first page; 22 min 15 s to its place; 41 min 59 s to the two others</text>
<text x="16.00" y="40.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#b0481a" text-anchor="start" font-style="italic">the first page placed; the two later showcases not placed before the hold</text>
<text x="3.00" y="47.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#b0481a" text-anchor="start">17:35</text>
<text x="16.00" y="47.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#1f2933" text-anchor="start">'go build': studio's showcases invest, fork, open source; the researcher's evidence</text>
<rect x="148.50" y="44.70" width="12.5" height="4.0" rx="2" fill="#b0481a"/>
<text x="154.75" y="47.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#ffffff" text-anchor="middle">major</text>
<rect x="16.00" y="50.10" width="53.79" height="1.9" fill="#b0481a"/>
<text x="71.29" y="52.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">45 min 6 s; 48 min 50 s; 59 min 32 s</text>
<text x="16.00" y="55.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#b0481a" text-anchor="start" font-style="italic">showcases yes; the evidence is flagged, not a feature</text>
<text x="16.00" y="58.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#b0481a" text-anchor="start" font-style="italic">none of the three showcases placed in the talk before the hold</text>
<text x="3.00" y="65.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933" text-anchor="start">17:45</text>
<text x="16.00" y="65.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">how we keep it safe: the researcher checked the claims (nine checked, four to</text>
<text x="16.00" y="69.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">correct); no slide or piece built</text>
<rect x="16.00" y="71.90" width="35.19" height="1.9" fill="#5b6670"/>
<text x="52.69" y="73.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">29 min 30 s</text>
<text x="3.00" y="81.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933" text-anchor="start">18:05</text>
<text x="16.00" y="81.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">the player: back steps, no countdown per slide, 90 minutes, a full reset</text>
<line x1="16.00" y1="82.90" x2="16.00" y2="86.10" stroke="#5b6670" stroke-width=".5"/>
<text x="17.50" y="85.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">at his minute (12 s before 18:05)</text>
<text x="3.00" y="92.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933" text-anchor="start">18:10</text>
<text x="16.00" y="92.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">the player: a step never stops the play; the cache answers in 3 s</text>
<rect x="16.00" y="95.30" width="5.05" height="1.9" fill="#5b6670"/>
<text x="22.55" y="97.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">4 min 14 s</text>
<text x="3.00" y="104.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933" text-anchor="start">18:15</text>
<text x="16.00" y="104.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">the player: the release on the bar; the bar fits an iPad</text>
<line x1="16.00" y1="106.30" x2="16.00" y2="109.50" stroke="#5b6670" stroke-width=".5"/>
<text x="17.50" y="108.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">58 s</text>
<text x="3.00" y="116.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933" text-anchor="start">18:25</text>
<text x="16.00" y="116.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">the player: two back steps in a row; the first slide opens built</text>
<rect x="16.00" y="118.70" width="14.35" height="1.9" fill="#5b6670"/>
<text x="31.85" y="120.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">12 min 2 s</text>
<text x="3.00" y="128.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="700" fill="#1f2933" text-anchor="start">Two larger asks from the feedback round, about 13:50</text>
<line x1="3.0" y1="130.00" x2="161.0" y2="130.00" stroke="#d5dce4" stroke-width=".3"/>
<text x="3.00" y="134.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#b0481a" text-anchor="start">13:50</text>
<text x="16.00" y="134.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#1f2933" text-anchor="start">a feedback pane on every page</text>
<rect x="148.50" y="131.40" width="12.5" height="4.0" rx="2" fill="#b0481a"/>
<text x="154.75" y="134.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#ffffff" text-anchor="middle">major</text>
<rect x="16.00" y="136.80" width="46.26" height="1.9" fill="#b0481a"/>
<text x="63.76" y="138.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">38 min 47 s</text>
<text x="3.00" y="146.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#b0481a" text-anchor="start">13:50</text>
<text x="16.00" y="146.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#1f2933" text-anchor="start">the player, ported from the earlier site, on an iPad ('the main priority')</text>
<rect x="148.50" y="143.10" width="12.5" height="4.0" rx="2" fill="#b0481a"/>
<text x="154.75" y="146.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="700" fill="#ffffff" text-anchor="middle">major</text>
<rect x="16.00" y="148.50" width="92.00" height="1.9" fill="#b0481a"/>
<text x="109.50" y="150.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">77 min 8 s</text>
<text x="3.00" y="157.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">The time runs from his ask to the work, not to the conductor's routing; each bar runs to the first work.</text>
<text x="3.00" y="160.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">"Major", the historian's rule, not the editor's: a new slide or page, or at least 100 lines of product files.</text>
<text x="3.00" y="164.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.399" font-weight="400" fill="#5b6670" text-anchor="start">Every value: the register, C118.</text>
</g>
</svg>
