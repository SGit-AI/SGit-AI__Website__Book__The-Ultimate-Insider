<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="113.8mm" viewBox="0 0 164 113.8" role="img" aria-label="Chapter 6: the decisions the work waited on, made; the governance ones, open at the end of the day"><text x="0.00" y="4.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Decided</text><text x="86.00" y="4.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="start">Open at 19:00</text><text x="86.00" y="8.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">The ones left were governance.</text><text x="0.00" y="8.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">The decisions he made were the ones the work</text><text x="0.00" y="12.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">was waiting for.</text><rect x="0" y="17.0" width="78.0" height="10" rx="1.5" fill="#fff" stroke="#1f2933" stroke-width=".4"/><path d="M3.6 22.2 l2 2 l3.6 -4" fill="none" stroke="#1f2933" stroke-width=".7" stroke-linecap="round"/><text x="12.00" y="23.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The framing</text><rect x="0" y="29.4" width="78.0" height="10" rx="1.5" fill="#fff" stroke="#1f2933" stroke-width=".4"/><path d="M3.6 34.6 l2 2 l3.6 -4" fill="none" stroke="#1f2933" stroke-width=".7" stroke-linecap="round"/><text x="12.00" y="35.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The beats</text><rect x="0" y="41.8" width="78.0" height="10" rx="1.5" fill="#fff" stroke="#1f2933" stroke-width=".4"/><path d="M3.6 47.0 l2 2 l3.6 -4" fill="none" stroke="#1f2933" stroke-width=".7" stroke-linecap="round"/><text x="12.00" y="48.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The parts</text><rect x="0" y="54.2" width="78.0" height="10" rx="1.5" fill="#fff" stroke="#1f2933" stroke-width=".4"/><path d="M3.6 59.4 l2 2 l3.6 -4" fill="none" stroke="#1f2933" stroke-width=".7" stroke-linecap="round"/><text x="12.00" y="60.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The members</text><rect x="0" y="66.6" width="78.0" height="10" rx="1.5" fill="#fff" stroke="#1f2933" stroke-width=".4"/><path d="M3.6 71.8 l2 2 l3.6 -4" fill="none" stroke="#1f2933" stroke-width=".7" stroke-linecap="round"/><text x="12.00" y="73.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The policies once the slide needed them</text><rect x="86.0" y="17.0" width="78.0" height="19.1" rx="1.5" fill="#fff" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.6 1"/><text x="89.00" y="22.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="start">Item 4</text><text x="89.00" y="26.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">the choice between two wordings for a line</text><text x="89.00" y="30.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">on a slide about which of its incidents were</text><text x="89.00" y="34.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">attacks.</text><rect x="86.0" y="38.5" width="78.0" height="19.1" rx="1.5" fill="#fff" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.6 1"/><text x="89.00" y="43.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="start">D12</text><text x="89.00" y="47.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">whether to do anything about other sites'</text><text x="89.00" y="52.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">tokens left in a pushed, public history the</text><text x="89.00" y="56.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">night before.</text><rect x="86.0" y="60.0" width="78.0" height="10.9" rx="1.5" fill="#fff" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.6 1"/><text x="89.00" y="65.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="start">D02</text><text x="89.00" y="69.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">what his signed answer would mean.</text><rect x="86.0" y="73.3" width="78.0" height="19.1" rx="1.5" fill="#fff" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.6 1"/><text x="89.00" y="78.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="start">The vault handovers</text><text x="89.00" y="82.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The handover files that held the team's</text><text x="89.00" y="86.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">vault keys, sealed for him to store, were</text><text x="89.00" y="90.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">waiting too.</text><rect x="0" y="98.8" width="164" height="14" rx="1.5" fill="#eef2f6"/><text x="4.00" y="104.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">The conductor recorded the state of all of them in one line:</text><text x="4.00" y="109.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">“no word yet; nobody waits on them for part 1”</text></svg>
