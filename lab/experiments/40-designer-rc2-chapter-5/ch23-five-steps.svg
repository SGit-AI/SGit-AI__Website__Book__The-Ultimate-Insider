<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="106.4mm" viewBox="0 0 164 106.4" role="img" aria-label="The five steps as a path, from an empty project to a second agent, each beside the matching Something to try card from this book"><line x1="10.00" y1="7.00" x2="10.00" y2="87.00" stroke="#b0481a" stroke-width="1.4" stroke-linecap="round"/><circle cx="10.0" cy="7.0" r="4" fill="#fff" stroke="#b0481a" stroke-width="1.2"/><text x="10.00" y="8.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="middle">1</text><text x="18.00" y="8.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">You: one tool and one empty</text><text x="18.00" y="12.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">project.</text><text x="91.00" y="8.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">start here</text><circle cx="10.0" cy="27.0" r="4" fill="#fff" stroke="#b0481a" stroke-width="1.2"/><text x="10.00" y="28.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="middle">2</text><text x="18.00" y="28.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">You: one page of rules</text><rect x="88" y="23.0" width="75.6" height="17.6" rx="1.8" fill="#eef2f6" stroke="#d5dce4" stroke-width=".4"/><text x="91.00" y="28.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">Something to try, chapter 4</text><text x="91.00" y="33.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">A page of rules is the cheapest</text><text x="91.00" y="37.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">safety you will ever add to an agent</text><line x1="78.00" y1="27.00" x2="87.00" y2="27.00" stroke="#d5dce4" stroke-width="0.4" stroke-linecap="round"/><circle cx="10.0" cy="47.0" r="4" fill="#fff" stroke="#b0481a" stroke-width="1.2"/><text x="10.00" y="48.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="middle">3</text><text x="18.00" y="48.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">You: one brief</text><rect x="88" y="43.0" width="75.6" height="13.4" rx="1.8" fill="#eef2f6" stroke="#d5dce4" stroke-width=".4"/><text x="91.00" y="48.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">Something to try, chapter 2</text><text x="91.00" y="53.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">you have your first brief</text><line x1="78.00" y1="47.00" x2="87.00" y2="47.00" stroke="#d5dce4" stroke-width="0.4" stroke-linecap="round"/><circle cx="10.0" cy="67.0" r="4" fill="#fff" stroke="#b0481a" stroke-width="1.2"/><text x="10.00" y="68.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="middle">4</text><text x="18.00" y="68.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Your agent builds, you check: ship</text><text x="18.00" y="72.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">something small that somebody else</text><text x="18.00" y="76.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">can use, the same day.</text><rect x="88" y="63.0" width="75.6" height="13.4" rx="1.8" fill="#eef2f6" stroke="#d5dce4" stroke-width=".4"/><text x="91.00" y="68.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">Something to try, chapter 15</text><text x="91.00" y="73.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">show it to one person</text><line x1="78.00" y1="67.00" x2="87.00" y2="67.00" stroke="#d5dce4" stroke-width="0.4" stroke-linecap="round"/><circle cx="10.0" cy="87.0" r="4" fill="#fff" stroke="#b0481a" stroke-width="1.2"/><text x="10.00" y="88.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#b0481a" text-anchor="middle">5</text><text x="18.00" y="88.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">Add a second agent only when the</text><text x="18.00" y="92.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">first is busy.</text><rect x="88" y="83.0" width="75.6" height="13.4" rx="1.8" fill="#eef2f6" stroke="#d5dce4" stroke-width=".4"/><text x="91.00" y="88.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">Something to try, chapter 5</text><text x="91.00" y="93.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">how you would stop it</text><line x1="78.00" y1="87.00" x2="87.00" y2="87.00" stroke="#d5dce4" stroke-width="0.4" stroke-linecap="round"/><path d="M5.4 69.0 C2.5999999999999996 64.0 2.5999999999999996 57.0 5.4 54.0" fill="none" stroke="#b0481a" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 55.6 l1 -1.6 l1.4 1.2" fill="none" stroke="#b0481a" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="18.00" y="81.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">then do it again</text><text x="0.00" y="104.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">from an empty project to a second agent; each card a line of that chapter’s Something to try</text></svg>
