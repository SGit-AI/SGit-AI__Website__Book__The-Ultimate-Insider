<text x="159.00" y="89.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.2" font-weight="400" fill="#5b6670" text-anchor="end">after the hold: work in flight still landed,</text>
<text x="159.00" y="93.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.2" font-weight="400" fill="#5b6670" text-anchor="end">and no further work commit followed that day</text>
