<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 104" role="img" aria-label="The evening of 29 October to scale: the lock tool at 17:54, three locks planned for 18:30, 19:30 and 20:00 drawn as open padlocks, the hold at 18:44, the last release at 18:46; no lock closed.">
