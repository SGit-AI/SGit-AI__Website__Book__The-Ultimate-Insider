<svg xmlns="http://www.w3.org/2000/svg" width="156mm" height="98.4mm" viewBox="0 0 156 98.4" role="img" aria-label="One of the storyteller's maps as it went into the talk: map 1, the outside is mature, the inside is not; positions, not measurements"><text x="0.00" y="3.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">Map 1: the outside is mature, the inside is not</text><rect x="8.00" y="13.38" width="77.38" height="74.62" fill="#eef2f6"/><text x="9.50" y="27.32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">shaded: behind the firewall</text><path d="M44.50 6.0 V88.0" stroke="#d5dce4" stroke-width=".3" stroke-dasharray="1 1"/><path d="M81.00 6.0 V88.0" stroke="#d5dce4" stroke-width=".3" stroke-dasharray="1 1"/><path d="M117.50 6.0 V88.0" stroke="#d5dce4" stroke-width=".3" stroke-dasharray="1 1"/><line x1="8.00" y1="88.00" x2="154.00" y2="88.00" stroke="#1f2933" stroke-width="0.5" stroke-linecap="round"/><line x1="8.00" y1="6.00" x2="8.00" y2="88.00" stroke="#1f2933" stroke-width="0.5" stroke-linecap="round"/><text x="26.25" y="92.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">Genesis</text><text x="62.75" y="92.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">Custom built</text><text x="99.25" y="92.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">Product (+rental)</text><text x="135.75" y="92.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="middle">Commodity (+utility)</text><text x="81.00" y="96.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="middle">Evolution</text><text x="9.50" y="9.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">Value chain (visible to invisible)</text><line x1="88.30" y1="8.46" x2="113.12" y2="22.40" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="88.30" y1="8.46" x2="48.88" y2="17.48" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="113.12" y1="22.40" x2="95.60" y2="37.16" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="113.12" y1="22.40" x2="136.48" y2="51.10" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="48.88" y1="17.48" x2="37.20" y2="38.80" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="48.88" y1="17.48" x2="51.80" y2="51.92" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="48.88" y1="17.48" x2="69.32" y2="65.04" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="51.80" y1="51.92" x2="69.32" y2="65.04" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="69.32" y1="65.04" x2="31.36" y2="74.88" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="51.80" y1="51.92" x2="81.00" y2="81.44" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><line x1="37.20" y1="38.80" x2="51.80" y2="51.92" stroke="#5b6670" stroke-width="0.35" stroke-linecap="round"/><path d="M97.00 37.160000000000004 H131.10" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.2 .8"/><path d="M130.10 36.16 L132.10 37.160000000000004 L130.10 38.16" stroke="#b0481a" stroke-width=".5" fill="none"/><path d="M50.28 17.480000000000004 H87.30" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.2 .8"/><path d="M86.30 16.48 L88.30 17.480000000000004 L86.30 18.48" stroke="#b0481a" stroke-width=".5" fill="none"/><circle cx="88.30" cy="8.46" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="90.50" y="6.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">The business: trust in its data</text><circle cx="113.12" cy="22.40" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="110.92" y="20.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="end">Internet-facing apps</text><circle cx="95.60" cy="37.16" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="97.80" y="35.56" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Open source, now with AI review</text><circle cx="136.48" cy="51.10" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="134.28" y="55.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="end">Edge, cloud, patching</text><circle cx="48.88" cy="17.48" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="51.08" y="15.88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start">Agents (the new insider)</text><circle cx="37.20" cy="38.80" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="39.40" y="37.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Legacy apps nobody understands</text><circle cx="51.80" cy="51.92" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="54.00" y="50.32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Internal systems, never met an adversary</text><circle cx="69.32" cy="65.04" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="71.52" y="63.44" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Permissions: coarse, over-granted</text><circle cx="31.36" cy="74.88" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="33.56" y="73.28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Security usability</text><circle cx="81.00" cy="81.44" r="1.3" fill="#fff" stroke="#1f2933" stroke-width=".5"/><text x="83.20" y="79.84" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">Recovery by the day, not the transaction</text><text x="154.00" y="15.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="end">outside: attacked for decades, evolved</text><text x="9.50" y="86.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#b0481a" text-anchor="start">inside: custom, unevolved, now under an insider with no limits</text><text x="154.00" y="96.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="end">positions, not measurements</text></svg>
