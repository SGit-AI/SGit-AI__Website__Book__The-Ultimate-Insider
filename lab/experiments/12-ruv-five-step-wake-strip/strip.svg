<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 192.0" role="img" aria-label="The five-step wake as one vertical strip: start, plan, pre-review, the gate, the work, post-review, post-check, close; a stop from any step writes HOLD.md and every wake stops.">
<rect x="0" y="1.00" width="108" height="18.20" rx="1.6" fill="#eef2f6" stroke="#5b6670" stroke-width=".5"/>
<text x="4.00" y="7.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Start <tspan font-weight="400" fill="#5b6670">· the member</tspan></text>
<text x="4.00" y="12.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">start.py pulls dev, prints the start banner. A hold on the</text>
<text x="4.00" y="16.05" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">team: no work, end banner, stop.</text>
<line x1="54.0" y1="19.20" x2="54.0" y2="22.20" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 21.00 L54.00 22.60 L55.30 21.00" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="22.80" width="108" height="22.85" rx="1.6" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/>
<circle cx="5.5" cy="28.00" r="3.1" fill="#1f2933"/><text x="5.50" y="29.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.6" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="11.00" y="29.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Plan <tspan font-weight="400" fill="#5b6670">· a conductor sub-agent</tspan></text>
<text x="4.00" y="33.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">reads the member's mail, board, requests and role; writes</text>
<text x="4.00" y="37.85" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">one to three items, requests first.</text>
<text x="4.00" y="42.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start"><tspan fill="#5b6670">verdicts: </tspan><tspan font-weight="700">go</tspan> · <tspan fill="#b0481a" font-weight="700">stop</tspan></text>
<line x1="54.0" y1="45.65" x2="54.0" y2="48.65" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 47.45 L54.00 49.05 L55.30 47.45" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="49.25" width="108" height="26.90" rx="1.6" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/>
<circle cx="5.5" cy="54.45" r="3.1" fill="#1f2933"/><text x="5.50" y="55.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.6" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="11.00" y="55.55" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Pre-review <tspan font-weight="400" fill="#5b6670">· a security sub-agent</tspan></text>
<text x="4.00" y="60.25" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">sees the plan and the rules, never the raw messages:</text>
<text x="4.00" y="64.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">policy, secrets, harm to other members.</text>
<text x="4.00" y="68.35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">A change sends the plan back: amend it, review it again.</text>
<text x="4.00" y="73.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start"><tspan fill="#5b6670">verdicts: </tspan><tspan font-weight="700">go</tspan> · <tspan font-weight="700">change</tspan> · <tspan fill="#b0481a" font-weight="700">stop</tspan></text>
<line x1="54.0" y1="76.15" x2="54.0" y2="79.15" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 77.95 L54.00 79.55 L55.30 77.95" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="79.75" width="108" height="14.15" rx="1.6" fill="#ffffff" stroke="#b0481a" stroke-width=".5" stroke-dasharray="1.6 1"/>
<text x="4.00" y="86.05" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Gate <tspan font-weight="400" fill="#5b6670">· wake.py gate</tspan></text>
<text x="4.00" y="90.75" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">refuses the work until steps 1 and 2 both say go.</text>
<line x1="54.0" y1="93.90" x2="54.0" y2="96.90" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 95.70 L54.00 97.30 L55.30 95.70" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="97.50" width="108" height="22.85" rx="1.6" fill="#f6e1d4" stroke="#1f2933" stroke-width=".5"/>
<circle cx="5.5" cy="102.70" r="3.1" fill="#1f2933"/><text x="5.50" y="103.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.6" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="11.00" y="103.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Work <tspan font-weight="400" fill="#5b6670">· the member</tspan></text>
<text x="4.00" y="108.50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">only inside its own policy's paths, and only after the</text>
<text x="4.00" y="112.55" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">gate.</text>
<text x="4.00" y="117.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start"><tspan fill="#5b6670">verdicts: </tspan><tspan font-weight="700">done</tspan> · <tspan font-weight="700">partial</tspan> · <tspan font-weight="700">none</tspan></text>
<line x1="54.0" y1="120.35" x2="54.0" y2="123.35" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 122.15 L54.00 123.75 L55.30 122.15" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="123.95" width="108" height="22.85" rx="1.6" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/>
<circle cx="5.5" cy="129.15" r="3.1" fill="#1f2933"/><text x="5.50" y="130.35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.6" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="11.00" y="130.25" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Post-review <tspan font-weight="400" fill="#5b6670">· a security sub-agent</tspan></text>
<text x="4.00" y="134.95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">reads the diff and runs the gate: secrets, writes outside</text>
<text x="4.00" y="139.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">policy, harm to other members.</text>
<text x="4.00" y="143.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start"><tspan fill="#5b6670">verdicts: </tspan><tspan font-weight="700">clean</tspan> · <tspan font-weight="700">finding</tspan> · <tspan fill="#b0481a" font-weight="700">stop</tspan></text>
<line x1="54.0" y1="146.80" x2="54.0" y2="149.80" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 148.60 L54.00 150.20 L55.30 148.60" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="150.40" width="108" height="18.80" rx="1.6" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/>
<circle cx="5.5" cy="155.60" r="3.1" fill="#1f2933"/><text x="5.50" y="156.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.6" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="11.00" y="156.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Post-check <tspan font-weight="400" fill="#5b6670">· a conductor sub-agent</tspan></text>
<text x="4.00" y="161.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">did it go according to plan, item by item?</text>
<text x="4.00" y="166.05" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start"><tspan fill="#5b6670">verdicts: </tspan><tspan font-weight="700">as-planned</tspan> · <tspan font-weight="700">partial</tspan> · <tspan font-weight="700">off-plan</tspan> · <tspan fill="#b0481a" font-weight="700">stop</tspan></text>
<line x1="54.0" y1="169.20" x2="54.0" y2="172.20" stroke="#1f2933" stroke-width=".5"/><path d="M52.70 171.00 L54.00 172.60 L55.30 171.00" fill="none" stroke="#1f2933" stroke-width=".5"/>
<rect x="0" y="172.80" width="108" height="18.20" rx="1.6" fill="#eef2f6" stroke="#5b6670" stroke-width=".5"/>
<text x="4.00" y="179.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#1f2933" text-anchor="start">Close <tspan font-weight="400" fill="#5b6670">· wake.py close</tspan></text>
<text x="4.00" y="183.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">refuses a wake that skipped a step. Then the release, the</text>
<text x="4.00" y="187.85" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">debrief, and the end banner, last.</text>
<rect x="118" y="91.07" width="46" height="36.30" rx="1.6" fill="#f6e1d4" stroke="#b0481a" stroke-width=".6"/>
<text x="121.00" y="97.37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.7" font-weight="700" fill="#b0481a" text-anchor="start">A stop, from any step</text>
<text x="121.00" y="102.07" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">writes the member's</text>
<text x="121.00" y="106.12" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">HOLD.md and pushes it to</text>
<text x="121.00" y="110.17" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">dev. From then on every</text>
<text x="121.00" y="114.22" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">member's start.py stops</text>
<text x="121.00" y="118.27" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">the wake, and only the</text>
<text x="121.00" y="122.32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.3" font-weight="400" fill="#1f2933" text-anchor="start">editor lifts the hold.</text>
<path d="M108.00 28.00 C114.00 28.00 112.00 109.22 118.00 109.22" fill="none" stroke="#b0481a" stroke-width=".45" stroke-dasharray="1.4 .9"/>
<path d="M108.00 54.45 C114.00 54.45 112.00 109.22 118.00 109.22" fill="none" stroke="#b0481a" stroke-width=".45" stroke-dasharray="1.4 .9"/>
<path d="M108.00 129.15 C114.00 129.15 112.00 109.22 118.00 109.22" fill="none" stroke="#b0481a" stroke-width=".45" stroke-dasharray="1.4 .9"/>
<path d="M108.00 155.60 C114.00 155.60 112.00 109.22 118.00 109.22" fill="none" stroke="#b0481a" stroke-width=".45" stroke-dasharray="1.4 .9"/>
</svg>
