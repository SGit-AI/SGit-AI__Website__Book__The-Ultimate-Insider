<svg xmlns="http://www.w3.org/2000/svg" width="164mm" height="61.9mm" viewBox="0 0 164 61.9" role="img" aria-label="Three speech cards from the editor, each dated, his words verbatim, none larger"><rect x="0.3" y=".3" width="52.2" height="55.3" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><g transform="translate(2.0 2) scale(.56)"><line x1="12.00" y1="31.00" x2="7.00" y2="36.60" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="28.00" y1="31.00" x2="32.00" y2="34.00" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="16.00" y1="42.00" x2="15.40" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="24.00" y1="42.00" x2="24.60" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="13.60" y1="47.80" x2="17.00" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="23.00" y1="47.80" x2="26.40" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><rect x="12" y="28" width="16" height="14" rx="3" fill="#264653" stroke="#1f2933" stroke-width="0.7"/><path d="M17.2 28.2 L20 32.6 L22.8 28.2" fill="#ffffff" stroke="#1f2933" stroke-width="0.45" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="18" r="8.6" fill="#eef2f6" stroke="#1f2933" stroke-width="0.7"/><g transform="translate(0 .2)"><circle cx="17" cy="18" r=".9" fill="#1f2933"/><circle cx="23" cy="18" r=".9" fill="#1f2933"/><path d="M17.4 21.3 Q20 23.9 22.6 21.3" fill="none" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="2.2" y="31.4" width="6.4" height="8.2" rx=".5" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/><line x1="3.40" y1="33.60" x2="7.40" y2="33.60" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="3.40" y1="35.40" x2="7.40" y2="35.40" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="3.40" y1="37.20" x2="6.20" y2="37.20" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="32.00" y1="34.00" x2="36.40" y2="28.60" stroke="#1f2933" stroke-width="0.9" stroke-linecap="round"/><line x1="36.40" y1="28.60" x2="37.20" y2="27.60" stroke="#b0481a" stroke-width="0.9" stroke-linecap="round"/></g><text x="26.00" y="12.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">the editor</text><text x="26.00" y="16.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">29 October,</text><text x="26.00" y="20.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">18:44</text><text x="3.00" y="34.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">“actually we are at 95% so</text><text x="3.00" y="38.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">it is better to pause all</text><text x="3.00" y="42.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">actions”</text><text x="3.00" y="52.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">as the hold file gives it</text><rect x="55.8" y=".3" width="52.2" height="55.3" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><g transform="translate(57.5 2) scale(.56)"><line x1="12.00" y1="31.00" x2="7.00" y2="36.60" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="28.00" y1="31.00" x2="32.00" y2="34.00" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="16.00" y1="42.00" x2="15.40" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="24.00" y1="42.00" x2="24.60" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="13.60" y1="47.80" x2="17.00" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="23.00" y1="47.80" x2="26.40" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><rect x="12" y="28" width="16" height="14" rx="3" fill="#264653" stroke="#1f2933" stroke-width="0.7"/><path d="M17.2 28.2 L20 32.6 L22.8 28.2" fill="#ffffff" stroke="#1f2933" stroke-width="0.45" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="18" r="8.6" fill="#eef2f6" stroke="#1f2933" stroke-width="0.7"/><g transform="translate(0 .2)"><circle cx="17" cy="18" r=".9" fill="#1f2933"/><circle cx="23" cy="18" r=".9" fill="#1f2933"/><path d="M17.4 21.3 Q20 23.9 22.6 21.3" fill="none" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="2.2" y="31.4" width="6.4" height="8.2" rx=".5" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/><line x1="3.40" y1="33.60" x2="7.40" y2="33.60" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="3.40" y1="35.40" x2="7.40" y2="35.40" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="3.40" y1="37.20" x2="6.20" y2="37.20" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="32.00" y1="34.00" x2="36.40" y2="28.60" stroke="#1f2933" stroke-width="0.9" stroke-linecap="round"/><line x1="36.40" y1="28.60" x2="37.20" y2="27.60" stroke="#b0481a" stroke-width="0.9" stroke-linecap="round"/></g><text x="81.50" y="12.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">the editor</text><text x="81.50" y="16.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">31 October,</text><text x="81.50" y="20.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">early hours</text><text x="58.50" y="34.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">“the 95%, it's an</text><text x="58.50" y="38.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">interesting point, but it's</text><text x="58.50" y="42.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">just a footnote”</text><text x="58.50" y="52.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">dictated review, after the day</text><rect x="111.3" y=".3" width="52.2" height="55.3" rx="2" fill="#fff" stroke="#1f2933" stroke-width=".45"/><g transform="translate(113.0 2) scale(.56)"><line x1="12.00" y1="31.00" x2="7.00" y2="36.60" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="28.00" y1="31.00" x2="32.00" y2="34.00" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="16.00" y1="42.00" x2="15.40" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="24.00" y1="42.00" x2="24.60" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="13.60" y1="47.80" x2="17.00" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="23.00" y1="47.80" x2="26.40" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><rect x="12" y="28" width="16" height="14" rx="3" fill="#264653" stroke="#1f2933" stroke-width="0.7"/><path d="M17.2 28.2 L20 32.6 L22.8 28.2" fill="#ffffff" stroke="#1f2933" stroke-width="0.45" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="18" r="8.6" fill="#eef2f6" stroke="#1f2933" stroke-width="0.7"/><g transform="translate(0 .2)"><circle cx="17" cy="18" r=".9" fill="#1f2933"/><circle cx="23" cy="18" r=".9" fill="#1f2933"/><path d="M17.4 21.3 Q20 23.9 22.6 21.3" fill="none" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="2.2" y="31.4" width="6.4" height="8.2" rx=".5" fill="#ffffff" stroke="#1f2933" stroke-width=".5"/><line x1="3.40" y1="33.60" x2="7.40" y2="33.60" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="3.40" y1="35.40" x2="7.40" y2="35.40" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="3.40" y1="37.20" x2="6.20" y2="37.20" stroke="#5b6670" stroke-width="0.4" stroke-linecap="round"/><line x1="32.00" y1="34.00" x2="36.40" y2="28.60" stroke="#1f2933" stroke-width="0.9" stroke-linecap="round"/><line x1="36.40" y1="28.60" x2="37.20" y2="27.60" stroke="#b0481a" stroke-width="0.9" stroke-linecap="round"/></g><text x="137.00" y="12.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="800" fill="#1f2933" text-anchor="start">the editor</text><text x="137.00" y="16.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">31 October,</text><text x="137.00" y="20.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">evening</text><text x="114.00" y="34.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">“The 95%, I think, was the</text><text x="114.00" y="38.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#1f2933" text-anchor="start">tokens usage.”</text><text x="114.00" y="52.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">in session, after the day</text><text x="0.00" y="60.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start">three accounts, equal and in the order given: which one leads is the editor's to sign (C089, open)</text></svg>
