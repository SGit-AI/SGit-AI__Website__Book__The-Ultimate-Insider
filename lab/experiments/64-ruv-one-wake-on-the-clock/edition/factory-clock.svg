<text x="112.00" y="30.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">Every member had its own</text>
<text x="112.00" y="34.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">minute past the hour, so</text>
<text x="112.00" y="39.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">the hour went round the</text>
<text x="112.00" y="43.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">team in turn, and then</text>
<text x="112.00" y="48.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#1f2933" text-anchor="start">began again.</text>
<text x="112.00" y="56.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">Work did not pass round the</text>
<text x="112.00" y="59.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">face: it went by letter,</text>
<text x="112.00" y="63.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start" font-style="italic">read at the next turn.</text>
<text x="2.00" y="86.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start">The schedule as it stood at the end of the day; it ran every hour, and members joined it</text>
<text x="2.00" y="90.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#5b6670" text-anchor="start">through the day. Each dot is a slot on the schedule, not a wake that ran.</text>
