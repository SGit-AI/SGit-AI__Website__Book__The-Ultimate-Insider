<svg xmlns="http://www.w3.org/2000/svg" width="158mm" height="45.1mm" viewBox="0 0 158 45.1" role="img" aria-label="The researcher's three findings of the night in a row, each with when it was found against the push and what was fixed"><text x="0.00" y="4.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">against the push at 02:22</text><rect x="0.3" y="9.0" width="50" height="31.4" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="3.30" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#b0481a" text-anchor="start" xml:space="preserve">found at 03:05</text><text x="3.30" y="20.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">the first, found after</text><text x="3.30" y="24.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">the push</text><text x="3.30" y="29.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">redacted in the files; the</text><text x="3.30" y="33.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">push stays in the history;</text><text x="3.30" y="37.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">the editor told</text><rect x="52.8" y="9.0" width="50" height="31.4" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="55.80" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#b0481a" text-anchor="start" xml:space="preserve">found at 04:10</text><text x="55.80" y="20.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">the second, found before</text><text x="55.80" y="24.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">the close</text><text x="55.80" y="29.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">28 values counted; 30 files</text><text x="55.80" y="33.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">redacted in the same wake; 0</text><text x="55.80" y="37.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">left</text><rect x="105.3" y="9.0" width="50" height="35.5" rx="1.8" fill="#fff" stroke="#1f2933" stroke-width=".45"/><text x="108.30" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#b0481a" text-anchor="start" xml:space="preserve">found at 06:14</text><text x="108.30" y="20.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">the third, missed by the</text><text x="108.30" y="24.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">first check</text><text x="108.30" y="29.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">found after the push; it</text><text x="108.30" y="33.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">stays in the history; 10</text><text x="108.30" y="37.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">pages redacted in the same</text><text x="108.30" y="41.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.18" font-weight="400" fill="#5b6670" text-anchor="start" xml:space="preserve">wake; 0 left</text></svg>
