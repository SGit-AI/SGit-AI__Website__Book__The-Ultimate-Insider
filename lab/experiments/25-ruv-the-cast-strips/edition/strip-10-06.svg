<text x="1.80" y="22.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">conductor</text>
<rect x="1.00" y="25.00" width="24.00" height="26.01" rx="1.4" fill="#eef2f6"/>
<text x="2.20" y="29.28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">I wrote the</text>
<text x="2.20" y="33.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">hold.</text>
<text x="2.20" y="37.21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">Everyone</text>
<text x="2.20" y="41.18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">stopped.</text>
<text x="2.20" y="45.15" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">Well, nearly</text>
<text x="2.20" y="49.12" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">everyone.</text>
<rect x="27.60" y="0.2" width="26.00" height="59.60" rx="1.6" fill="none" stroke="#d5dce4" stroke-width=".3"/>
<svg x="33.60" y="2.00" width="14.00" height="17.50" viewBox="0 0 20 25" preserveAspectRatio="xMidYMid meet"><g transform="scale(.5)"><line x1="12.00" y1="31.00" x2="7.00" y2="36.60" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="28.00" y1="31.00" x2="32.00" y2="34.00" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="16.00" y1="42.00" x2="15.40" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="24.00" y1="42.00" x2="24.60" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="13.60" y1="47.80" x2="17.00" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="23.00" y1="47.80" x2="26.40" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><rect x="12" y="28" width="16" height="14" rx="3" fill="#b0481a" stroke="#1f2933" stroke-width="0.7"/><rect x="10" y="10" width="20" height="16" rx="3.2" fill="#eef2f6" stroke="#1f2933" stroke-width="0.7"/><circle cx="20" cy="18" r="6" fill="#ffffff" stroke="#1f2933" stroke-width=".6"/><circle cx="24.90" cy="18.00" r=".35" fill="#1f2933"/><circle cx="20.00" cy="22.90" r=".35" fill="#1f2933"/><circle cx="15.10" cy="18.00" r=".35" fill="#1f2933"/><circle cx="20.00" cy="13.10" r=".35" fill="#1f2933"/><line x1="20.00" y1="18.00" x2="17.23" y2="19.60" stroke="#1f2933" stroke-width="0.9" stroke-linecap="round"/><line x1="20.00" y1="18.00" x2="23.98" y2="20.30" stroke="#b0481a" stroke-width="0.7" stroke-linecap="round"/><line x1="20.00" y1="10.00" x2="20.00" y2="6.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><circle cx="20" cy="5.2" r="1.6" fill="#b0481a"/><line x1="32.00" y1="34.00" x2="36.20" y2="27.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="36.20" y1="27.40" x2="38.60" y2="23.60" stroke="#b0481a" stroke-width="0.9" stroke-linecap="round"/></g></svg>
<text x="29.40" y="22.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">conductor</text>
<rect x="28.60" y="25.00" width="24.00" height="26.01" rx="1.4" fill="#eef2f6"/>
<text x="29.80" y="29.28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">The designer</text>
<text x="29.80" y="33.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">pushed after</text>
<text x="29.80" y="37.21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">it. The work</text>
<text x="29.80" y="41.18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">in flight</text>
<text x="29.80" y="45.15" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">still</text>
<text x="29.80" y="49.12" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">landed.</text>
<rect x="55.20" y="0.2" width="26.00" height="59.60" rx="1.6" fill="none" stroke="#d5dce4" stroke-width=".3"/>
