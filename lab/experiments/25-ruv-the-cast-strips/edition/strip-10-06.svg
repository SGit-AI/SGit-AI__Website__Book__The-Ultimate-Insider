<text x="57.00" y="22.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">conductor</text>
<rect x="56.20" y="25.00" width="24.00" height="26.01" rx="1.4" fill="#eef2f6"/>
<text x="57.40" y="29.28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">Was the</text>
<text x="57.40" y="33.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">brake late?</text>
<text x="57.40" y="37.21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">Or was it</text>
<text x="57.40" y="41.18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">right on</text>
<text x="57.40" y="45.15" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">time? You</text>
<text x="57.40" y="49.12" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">can tell me.</text>
<rect x="82.80" y="0.2" width="26.00" height="59.60" rx="1.6" fill="none" stroke="#d5dce4" stroke-width=".3"/>
<rect x="89.30" y="2.5" width="13" height="16" fill="none" stroke="#5b6670" stroke-width=".35" stroke-dasharray="1 .8"/>
<text x="84.60" y="22.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">empty chair,</text>
<text x="84.60" y="26.57" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">security</text>
<rect x="110.40" y="0.2" width="26.00" height="59.60" rx="1.6" fill="none" stroke="#d5dce4" stroke-width=".3"/>
<svg x="116.40" y="2.00" width="14.00" height="17.50" viewBox="0 0 20 25" preserveAspectRatio="xMidYMid meet"><g transform="scale(.5)"><line x1="12.00" y1="31.00" x2="7.00" y2="36.60" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="28.00" y1="31.00" x2="32.00" y2="34.00" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="16.00" y1="42.00" x2="15.40" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="24.00" y1="42.00" x2="24.60" y2="47.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="13.60" y1="47.80" x2="17.00" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="23.00" y1="47.80" x2="26.40" y2="47.80" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><rect x="12" y="28" width="16" height="14" rx="3" fill="#b0481a" stroke="#1f2933" stroke-width="0.7"/><rect x="10" y="10" width="20" height="16" rx="3.2" fill="#eef2f6" stroke="#1f2933" stroke-width="0.7"/><circle cx="20" cy="18" r="6" fill="#ffffff" stroke="#1f2933" stroke-width=".6"/><circle cx="24.90" cy="18.00" r=".35" fill="#1f2933"/><circle cx="20.00" cy="22.90" r=".35" fill="#1f2933"/><circle cx="15.10" cy="18.00" r=".35" fill="#1f2933"/><circle cx="20.00" cy="13.10" r=".35" fill="#1f2933"/><line x1="20.00" y1="18.00" x2="20.00" y2="21.20" stroke="#1f2933" stroke-width="0.9" stroke-linecap="round"/><line x1="20.00" y1="18.00" x2="20.40" y2="22.58" stroke="#b0481a" stroke-width="0.7" stroke-linecap="round"/><line x1="20.00" y1="10.00" x2="20.00" y2="6.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><circle cx="20" cy="5.2" r="1.6" fill="#b0481a"/><line x1="32.00" y1="34.00" x2="36.20" y2="27.40" stroke="#1f2933" stroke-width="0.7" stroke-linecap="round"/><line x1="36.20" y1="27.40" x2="38.60" y2="23.60" stroke="#b0481a" stroke-width="0.9" stroke-linecap="round"/><path d="M30.6 9.6 q-1.5 2.2 0 3 q1.5 -.8 0 -3" fill="#bcd3e6" stroke="#1f2933" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
<text x="112.20" y="22.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">conductor</text>
<rect x="111.40" y="25.00" width="24.00" height="29.98" rx="1.4" fill="#eef2f6"/>
<text x="112.60" y="29.28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">Nobody</text>
<text x="112.60" y="33.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">lifted it</text>
<text x="112.60" y="37.21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">that day.</text>
<text x="112.60" y="41.18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">Only the</text>
<text x="112.60" y="45.15" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">editor can,</text>
<text x="112.60" y="49.12" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">and he was</text>
<text x="112.60" y="53.09" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">on stage.</text>
<rect x="138.00" y="0.2" width="26.00" height="59.60" rx="1.6" fill="none" stroke="#d5dce4" stroke-width=".3"/>
