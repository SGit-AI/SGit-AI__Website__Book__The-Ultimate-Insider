<text x="139.80" y="22.60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" font-weight="700" fill="#1f2933">conductor</text>
<rect x="139.00" y="25.00" width="24.00" height="22.04" rx="1.4" fill="#eef2f6"/>
<text x="140.20" y="29.28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">I could keep</text>
<text x="140.20" y="33.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">going. That</text>
<text x="140.20" y="37.21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">is exactly</text>
<text x="140.20" y="41.18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">why I am</text>
<text x="140.20" y="45.15" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#1f2933">stopping.</text>
</svg>
