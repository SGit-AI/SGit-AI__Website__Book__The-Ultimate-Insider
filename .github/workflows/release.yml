# CI owns the version (https://newsroom.sgit.ai/articles/ci-owns-the-version.html).
#
# Any push: build with the version "pending" and run the gate.
# A push to dev or main, after the gate: ONE release job at a time reads the newest tag, picks the next number
# (dev bumps the last number, main the middle one), writes ./version, commits as GitHub Actions with the subject
# "site vX.Y.Z: <the pushed subject>", tags that commit, pushes, then builds THAT commit and deploys it to Pages.
# The push uses the workflow's own token, which starts no second run. Nobody else writes ./version: a guard fails
# the run if any other author changed it. Pages source must be "GitHub Actions" (Settings, Pages).
name: release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: guard, nobody but CI writes the version
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            if git log --format=%an "$BEFORE..HEAD" -- version | grep -qv '^GitHub Actions$'; then
              echo "::error::./version was edited by someone other than CI"; exit 1; fi
          fi
      - name: build (pending) and gate
        run: python3 admin/build/build.py --version pending && python3 admin/build/validate.py

  release:
    needs: gate
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    concurrency: { group: release, cancel-in-progress: false }
    permissions: { contents: write }
    outputs: { version: "${{ steps.number.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.ref_name }}" }
      - id: number
        env: { BRANCH: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"; git config user.email "actions@github.com"
          for try in 1 2 3; do
            git fetch --quiet --tags origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"                 # a push that landed meanwhile rides this release
            if [ "$(git log -1 --format=%an)" = "GitHub Actions" ] && [ -f version ]; then
              NEW=$(cat version); echo "head is already release $NEW"; break; fi
            # the higher of the newest tag and ./version: a release commit whose tag never reached the remote
            # (v0.1.307, 1 November) otherwise makes every later run compute the same number and fail
            FILEV=$(grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' version 2>/dev/null || true)
            LAST=$( { git tag --list 'v*'; echo "$FILEV"; } | grep . | sort -V | tail -1 || true)
            if [ -z "$LAST" ]; then NEW=v0.1.0
            else IFS=. read -r A B C <<< "${LAST#v}"
              if [ "$BRANCH" = main ]; then NEW="v$A.$((B + 1)).0"; else NEW="v$A.$B.$((C + 1))"; fi; fi
            SUBJECT=$(git log -1 --format=%s)
            printf '%s\n' "$NEW" > version
            git add version; git commit -q -m "site $NEW: $SUBJECT"; git tag "$NEW"
            if git push origin "HEAD:$BRANCH"; then git push origin "refs/tags/$NEW"; echo "released $NEW"; break; fi
            git tag -d "$NEW"; echo "$BRANCH moved; taking it in (attempt $try)"
            [ "$try" = 3 ] && { echo "::error::$BRANCH kept moving; nothing released"; exit 1; }
          done
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
      - name: build the release commit and gate it again
        run: python3 admin/build/build.py && python3 admin/build/validate.py && grep -qx "${{ steps.number.outputs.version }}" _site/version.txt
      - name: the chapter bar's libraries, hash-checked (security 078, publisher 085; the accepted command word for word, a failure warns)
        continue-on-error: true
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r publishing/requirements-chapter-bar.txt \
            || echo "::warning::the chapter bar's libraries are not installed: the PDFs ship without it"
      - name: the manuscript, as PDF and EPUB (publisher's request; a failure warns and never stops the site's release)
        continue-on-error: true
        run: |
          sudo apt-get install -y -q pandoc poppler-utils && python3 publishing/build_book.py \
            || echo "::warning::the manuscript did not build: the site is released without the PDF and EPUB"
      - name: the 3- and 10-page editions, as PDF (cleared by security, security__022; a failure warns and never stops the site's release)
        continue-on-error: true
        run: |
          for n in 03 10; do
            python3 publishing/edition.py "$n" && python3 publishing/build_book.py --book "manuscript/editions/$n/Book.txt" --no-toc --no-epub \
              --cover lab/experiments/33-designer-cover-studies/cover-a-signed.svg --extra-css lab/tools/book/speakers.css \
              --name "one-human-nine-agents-edition-$n" --out _site/editions \
              --stamp "One Human, Nine Agents, Nineteen Hours: the $((10#$n))-page edition" \
              || echo "::warning::the $n-page edition did not build: the site is released without it"
          done
      - name: the RC2 draft, every drafted chapter, as PDF (published in review at the editor's word, 3 November; a failure warns and never stops the site's release)
        continue-on-error: true
        run: |
          ls "$PWD"/manuscript/rc2/30/*.md > "$RUNNER_TEMP/rc2-book.txt" \
            && python3 publishing/build_book.py --book "$RUNNER_TEMP/rc2-book.txt" --no-toc --no-epub --cast --figures publishing/rc2-figures.json \
                 --cover lab/experiments/33-designer-cover-studies/cover-a-signed.svg --extra-css lab/tools/book/speakers.css \
                 --name one-human-nine-agents-rc2-draft --out _site/rc2 \
                 --stamp "One Human, Nine Agents, Nineteen Hours: RC2, the 30-page edition, DRAFT IN REVIEW" \
            || echo "::warning::the RC2 draft did not build: the site is released without it"
      - name: the RC2 70-page draft, as PDF (published in review at the editor's word, 3 November; a failure warns and never stops the site's release)
        continue-on-error: true
        run: |
          python3 publishing/build_book.py --book manuscript/editions/rc2-70/Book.txt --no-toc --no-epub --cast --figures publishing/rc2-figures.json \
            --cover lab/experiments/33-designer-cover-studies/cover-a-signed.svg --extra-css lab/tools/book/speakers.css \
            --name one-human-nine-agents-rc2-70-draft --out _site/rc2 \
            --stamp "One Human, Nine Agents, Nineteen Hours: RC2, the 70-page edition, DRAFT IN REVIEW" \
            || echo "::warning::the RC2 70-page draft did not build: the site is released without it"
      - name: the full book's draft, as PDF (OL1, the editor, 3 November, the latest version always online; a failure warns and never stops the site's release)
        continue-on-error: true
        run: |
          python3 publishing/build_book.py --book manuscript/editions/rc2-150/Book.txt --no-toc --no-epub --cast --figures publishing/rc2-figures.json \
            --cover lab/experiments/33-designer-cover-studies/cover-a-signed.svg --extra-css lab/tools/book/speakers.css \
            --name one-human-nine-agents-rc2-full-draft --out _site/rc2 \
            --stamp "One Human, Nine Agents, Nineteen Hours: RC2, the full book, DRAFT IN REVIEW" \
            || echo "::warning::the full book's draft did not build: the site is released without it"
      - name: the upload set, kept on the site as the master (the editor, 4 November, "we have a master of everything"; a failure warns and never stops the release)
        continue-on-error: true
        run: |
          mkdir -p _site/rc2/upload
          python3 publishing/build_book.py --book manuscript/editions/rc2-150/Book.txt --no-toc --no-epub --cast --figures publishing/rc2-figures.json \
            --extra-css lab/tools/book/speakers.css \
            --name one-human-nine-agents-rc2-kdp-interior --out _site/rc2/upload \
            || echo "::warning::the KDP interior did not build: the site is released without it"
          cp lab/experiments/44-designer-print-cover/kdp-full-cover-*.pdf _site/rc2/upload/ 2>/dev/null || echo "::warning::no KDP cover PDF in lab/experiments/44-designer-print-cover"
          # the A4 review copy for the London print shop (the editor, 5 November 2026, briefs 52 to 55): built once in the
          # conductor's session, where the book's own fonts are installed, and kept as a file, so the release does not
          # rebuild it with fallback fonts (which set it 11 pages longer); its source is lab/experiments/77-a4-print/
          cp lab/experiments/77-a4-print/a4-interior.pdf _site/rc2/upload/one-human-nine-agents-rc2-a4-interior.pdf 2>/dev/null || echo "::warning::no A4 interior in lab/experiments/77-a4-print"
          cp lab/experiments/77-a4-print/a4-full-cover.pdf _site/rc2/upload/one-human-nine-agents-rc2-a4-full-cover.pdf 2>/dev/null || echo "::warning::no A4 cover in lab/experiments/77-a4-print"
          # one stable name for the full cover, for the print-request page (the editor, 5 November 2026, brief 47)
          cp "$(ls lab/experiments/44-designer-print-cover/kdp-full-cover-*-white.pdf 2>/dev/null | head -1)" _site/rc2/upload/one-human-nine-agents-rc2-full-cover.pdf 2>/dev/null || echo "::warning::no full cover for the print-request page"
          cp lab/experiments/44-designer-print-cover/leanpub-cover-1800x2700.png _site/rc2/upload/ 2>/dev/null || echo "::warning::no Leanpub cover in lab/experiments/44-designer-print-cover"
      - name: the interior's printed page count, for the cover (publisher 051; written to the site so every member can read it; warns, never stops the release)
        continue-on-error: true
        run: |
          PDF=_site/rc2/upload/one-human-nine-agents-rc2-kdp-interior.pdf
          [ -f "$PDF" ] || { echo "::warning::no KDP interior to count"; exit 0; }
          python3 publishing/cover_size.py --pdf "$PDF" --paper white > _site/rc2/upload/kdp-interior-count.txt \
            || { echo "::warning::cover_size.py could not count the interior"; exit 0; }
          cat _site/rc2/upload/kdp-interior-count.txt
          N=$(awk '/^interior/ {print $2; exit}' _site/rc2/upload/kdp-interior-count.txt || true)
          FOUND=0
          for c in lab/experiments/44-designer-print-cover/kdp-full-cover-*-white.pdf; do
            [ -f "$c" ] || continue
            FOUND=1
            M=$(basename "$c" | sed -E 's/^kdp-full-cover-([0-9]+)-white\.pdf$/\1/' || true)
            if [ "$M" = "$N" ]; then echo "cover $c matches the interior: $N pages"
            else echo "::warning::cover $c is for $M pages; the interior prints $N: the designer resizes it"; fi
          done
          [ "$FOUND" = 1 ] || echo "::warning::no white KDP cover to compare with the interior's $N pages"
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: release
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: false }  # renamed 3 Nov: run 41664598286 stuck "waiting" held the old group
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: verify the live site serves the new version
        env: { V: "${{ needs.release.outputs.version }}", URL: "${{ steps.deployment.outputs.page_url }}" }
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${URL%/}/version.txt" | grep -qx "$V"; then echo "live: $V"; exit 0; fi; sleep 15; done
          echo "::warning::live site did not show $V within 5 minutes (custom domain or CDN cache?)"
