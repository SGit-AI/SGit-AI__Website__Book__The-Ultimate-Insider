<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" data-format="h" data-min="42"><title>One mandate, written twice: ROLE.md for the editor, policy.json for the tools</title><rect width="1600" height="700" fill="#ffffff"/><rect x="60" y="52" width="12" height="64" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="92" y="104" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#1f2933" text-anchor="start">One mandate, written twice</text><rect x="60" y="150" width="720" height="430" rx="10" fill="#eef2f6" stroke="none" stroke-width="0"/><text x="96" y="222" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="48" font-weight="700" fill="#1f2933" text-anchor="start">ROLE.md</text><text x="96" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">prose, for the editor</text><circle cx="106" cy="340" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="130" y="354" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">What it is for</text><circle cx="106" cy="400" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="130" y="414" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">Its rules, and why</text><circle cx="106" cy="460" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="130" y="474" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">Its policy, in prose</text><rect x="820" y="150" width="720" height="430" rx="10" fill="#f6e1d4" stroke="none" stroke-width="0"/><text x="856" y="222" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="48" font-weight="700" fill="#1f2933" text-anchor="start">policy.json</text><text x="856" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">data, for the tools</text><circle cx="866" cy="340" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="890" y="354" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">wanted / not wanted</text><circle cx="866" cy="400" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="890" y="414" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">scope.writes</text><circle cx="866" cy="460" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="890" y="474" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">scope.holds</text><circle cx="866" cy="520" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="890" y="534" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">appends, never</text><text x="70" y="650" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start" font-style="italic">Nothing checked that the two agreed: look where they differ first.</text></svg>
