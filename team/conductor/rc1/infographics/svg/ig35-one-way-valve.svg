<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" data-format="h" data-min="42"><title>The one-way valve: the book reads the blind repository, nothing flows back</title><rect width="1600" height="700" fill="#ffffff"/><rect x="60" y="52" width="12" height="64" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="92" y="104" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#1f2933" text-anchor="start">The one-way valve</text><rect x="60" y="160" width="560" height="380" rx="10" fill="#eef2f6" stroke="none" stroke-width="0"/><text x="90" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#1f2933" text-anchor="start">The book's repository</text><text x="90" y="300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">knows the talk,</text><text x="90" y="352" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">the editor, and</text><text x="90" y="405" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">what came after</text><rect x="980" y="160" width="560" height="380" rx="10" fill="#f6e1d4" stroke="#b0481a" stroke-width="4"/><text x="1010" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#1f2933" text-anchor="start">The blind repository</text><text x="1010" y="300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">the talk's record</text><text x="1010" y="352" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">at 298be4e,</text><text x="1010" y="405" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">nothing else</text><line x1="970" y1="290" x2="666.0" y2="290.0" stroke="#1f2933" stroke-width="7"/><polygon points="640,290 666.0,305.6 666.0,274.4" fill="#1f2933"/><text x="805" y="260" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#1f2933" text-anchor="middle">read only</text><line x1="640" y1="420" x2="944.0" y2="420.0" stroke="#9aa5b1" stroke-width="7"/><polygon points="970,420 944.0,404.4 944.0,435.6" fill="#9aa5b1"/><line x1="770" y1="380" x2="840" y2="460" stroke="#b0481a" stroke-width="8"/><line x1="840" y1="380" x2="770" y2="460" stroke="#b0481a" stroke-width="8"/><text x="805" y="510" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="middle">nothing back</text><text x="60" y="610" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start" font-style="italic">Crossed once: the hand-off. A rule, not a wall: one account.</text></svg>
