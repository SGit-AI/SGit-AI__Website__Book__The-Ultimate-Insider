<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" data-format="h" data-min="42"><title>Reach, mandate and the gap between them, with what may stand in it</title><rect width="1600" height="700" fill="#ffffff"/><rect x="60" y="52" width="12" height="64" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="92" y="104" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#1f2933" text-anchor="start">Reach, mandate, and the gap</text><rect x="60" y="150" width="860" height="490" rx="10" fill="#eef2f6" stroke="#1f2933" stroke-width="3"/><text x="92" y="218" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#1f2933" text-anchor="start">Reach: the whole repository,</text><text x="92" y="270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#1f2933" text-anchor="start">any branch, the allowed hosts</text><rect x="540" y="380" width="350" height="230" rx="10" fill="#f6e1d4" stroke="#b0481a" stroke-width="4"/><text x="570" y="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="start">Mandate:</text><text x="570" y="502" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="start">its own folder</text><text x="110" y="480" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start" font-style="italic">the gap</text><text x="110" y="540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">everything else</text><text x="980" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#1f2933" text-anchor="start">What stands in the gap</text><rect x="980" y="236" width="14" height="52" rx="3" fill="#b0481a" stroke="none" stroke-width="0"/><text x="1016" y="278" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="start">A boundary</text><rect x="980" y="310" width="14" height="52" rx="3" fill="#1f2933" stroke="none" stroke-width="0"/><text x="1016" y="352" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">A setting</text><rect x="980" y="384" width="14" height="52" rx="3" fill="#1f2933" stroke="none" stroke-width="0"/><text x="1016" y="426" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">An expectation</text><rect x="980" y="458" width="14" height="52" rx="3" fill="#4a5562" stroke="none" stroke-width="0"/><text x="1016" y="500" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">Nothing</text><text x="980" y="580" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="start">Only a boundary</text><text x="980" y="630" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="start">is a control.</text></svg>
