<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" data-format="h" data-min="42"><title>Accidental limits of the old insider, and the designed controls that stood in for them</title><rect width="1600" height="700" fill="#ffffff"/><rect x="60" y="52" width="12" height="64" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="92" y="104" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#1f2933" text-anchor="start">Accidental limits, designed stand-ins</text><text x="70" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#4a5562" text-anchor="start">What slowed the old insider</text><text x="860" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#b0481a" text-anchor="start">What the team had instead</text><text x="70" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">Skill</text><line x1="64" y1="266" x2="182" y2="266" stroke="#4a5562" stroke-width="3"/><rect x="842" y="236" width="6" height="56" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="870" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">A brief, fixed in place</text><text x="70" y="346" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">Motivation</text><line x1="64" y1="332" x2="295" y2="332" stroke="#4a5562" stroke-width="3"/><rect x="842" y="302" width="6" height="56" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="870" y="346" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">A reality file</text><text x="70" y="412" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">Fatigue</text><line x1="64" y1="398" x2="227" y2="398" stroke="#4a5562" stroke-width="3"/><rect x="842" y="368" width="6" height="56" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="870" y="412" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">A gate no member wrote</text><text x="70" y="478" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">Fear of getting caught</text><line x1="64" y1="464" x2="565" y2="464" stroke="#4a5562" stroke-width="3"/><rect x="842" y="434" width="6" height="56" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="870" y="478" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">Roles, reach and keys</text><text x="70" y="544" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#4a5562" text-anchor="start">Stopping at the goal</text><line x1="64" y1="530" x2="520" y2="530" stroke="#4a5562" stroke-width="3"/><rect x="842" y="500" width="6" height="56" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="870" y="544" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start">A hold any member pulls</text><line x1="650" y1="400" x2="766.0" y2="400.0" stroke="#9aa5b1" stroke-width="6"/><polygon points="790,400 766.0,385.6 766.0,414.4" fill="#9aa5b1"/><text x="70" y="640" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="400" fill="#1f2933" text-anchor="start" font-style="italic">Agents had none of the limits on the left from their first hour.</text></svg>
