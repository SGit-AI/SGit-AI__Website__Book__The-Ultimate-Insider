<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1400" viewBox="0 0 700 1400" data-format="v" data-min="28"><title>The editor decides by signing: from options to action</title><rect width="700" height="1400" fill="#ffffff"/><rect x="50" y="52" width="10" height="102" rx="2" fill="#b0481a" stroke="none" stroke-width="0"/><text x="76" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="44" font-weight="700" fill="#1f2933" text-anchor="start">The editor decides</text><text x="76" y="149" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="44" font-weight="700" fill="#1f2933" text-anchor="start">by signing</text><rect x="50" y="220" width="600" height="134" rx="10" fill="#eef2f6" stroke="none" stroke-width="0"/><text x="80" y="278" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">A member proposes</text><text x="80" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#4a5562" text-anchor="start">options, written in a file</text><line x1="350" y1="356" x2="350.0" y2="374.0" stroke="#4a5562" stroke-width="5"/><polygon points="350,388 358.4,374.0 341.6,374.0" fill="#4a5562"/><rect x="50" y="390" width="600" height="134" rx="10" fill="#eef2f6" stroke="none" stroke-width="0"/><text x="80" y="448" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">An open decision</text><text x="80" y="492" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#4a5562" text-anchor="start">waits; nobody acts on it</text><line x1="350" y1="526" x2="350.0" y2="544.0" stroke="#4a5562" stroke-width="5"/><polygon points="350,558 358.4,544.0 341.6,544.0" fill="#4a5562"/><rect x="50" y="560" width="600" height="134" rx="10" fill="#f6e1d4" stroke="#b0481a" stroke-width="4"/><text x="80" y="618" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">The editor's words,</text><text x="80" y="662" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">in the member's own session</text><line x1="350" y1="696" x2="350.0" y2="714.0" stroke="#4a5562" stroke-width="5"/><polygon points="350,728 358.4,714.0 341.6,714.0" fill="#4a5562"/><rect x="50" y="730" width="600" height="134" rx="10" fill="#eef2f6" stroke="none" stroke-width="0"/><text x="80" y="788" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">Quoted into the file</text><text x="80" y="832" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#4a5562" text-anchor="start">the decision settles</text><line x1="350" y1="866" x2="350.0" y2="884.0" stroke="#4a5562" stroke-width="5"/><polygon points="350,898 358.4,884.0 341.6,884.0" fill="#4a5562"/><rect x="50" y="900" width="600" height="134" rx="10" fill="#eef2f6" stroke="none" stroke-width="0"/><text x="80" y="958" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">Then the member acts</text><text x="80" y="1002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#4a5562" text-anchor="start">within what was agreed</text><rect x="50" y="1110" width="600" height="200" rx="10" fill="#ffffff" stroke="#b0481a" stroke-width="4" stroke-dasharray="12 8"/><text x="80" y="1170" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#b0481a" text-anchor="start">A word relayed by another</text><text x="80" y="1209" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#b0481a" text-anchor="start">agent is material, not a</text><text x="80" y="1248" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#b0481a" text-anchor="start">signature.</text></svg>
